<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04060b">
<meta name="description" content="SPACE MINER — a premium space mining adventure. Mine asteroids, upgrade your ship, deploy drones, explore five sectors.">
<title>SPACE MINER — Deep Belt Operations</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;
    font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;color:#d9edf7;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:block;background:#04060b}
  #game{position:absolute;inset:0;display:block;width:100%;height:100%;
    cursor:crosshair;touch-action:none;outline:none}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.28;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:3px 3px;mix-blend-mode:overlay}
  #boot-fallback{position:fixed;inset:0;display:grid;place-items:center;z-index:1;
    background:radial-gradient(circle at 50% 45%,#0a1725,#04060b 70%);
    font-family:"Consolas","DejaVu Sans Mono",monospace;letter-spacing:.32em;color:#5fe6d8;font-size:12px}
  noscript{position:fixed;inset:0;display:grid;place-items:center;color:#ffb257;font-size:14px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="grain"></div>
  <div id="boot-fallback">SPACE MINER · CALIBRATING</div>
</div>

<script>
/* ---- core/util.js ---- */
/* =========================================================================
   SPACE MINER — core utilities, math, deterministic randomness
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});

  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : clamp((v - a) / (b - a), 0, 1); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function smoothstep(a, b, v) { return smooth(invLerp(a, b, v)); }
  function dist2(ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
  function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
  function sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; }
  function round2(v) { return Math.round(v * 100) / 100; }

  function angleDiff(a, b) {
    var d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }
  function angleLerp(a, b, t) { return a + angleDiff(a, b) * t; }
  function approach(cur, target, rate) {
    if (cur < target) return Math.min(target, cur + rate);
    if (cur > target) return Math.max(target, cur - rate);
    return target;
  }

  /* ---------- deterministic RNG (mulberry32) ---------- */
  function RNG(seed) {
    this.s = (seed >>> 0) || 0x9e3779b9;
  }
  RNG.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    var t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
  RNG.prototype.int = function (a, b) { return Math.floor(this.range(a, b + 1)); };
  RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; };
  RNG.prototype.chance = function (p) { return this.next() < p; };
  RNG.prototype.sign = function () { return this.next() < 0.5 ? -1 : 1; };
  RNG.prototype.shuffle = function (arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(this.next() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  RNG.prototype.weighted = function (items, weightFn) {
    var total = 0, i;
    for (i = 0; i < items.length; i++) total += Math.max(0, weightFn(items[i], i));
    if (total <= 0) return items[0];
    var r = this.next() * total;
    for (i = 0; i < items.length; i++) {
      r -= Math.max(0, weightFn(items[i], i));
      if (r <= 0) return items[i];

  RNG.prototype.gauss = function () {
    var u = 1 - this.next(), v = this.next();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  };

  function hashStr(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /* ---------- colour helpers ---------- */
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgba(r, g, b, a) {
    return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + (a === undefined ? 1 : a) + ')';
  }
  function hexA(hex, a) {
    var c = hexToRgb(hex);
    return rgba(c.r, c.g, c.b, a);
  }
  function mixHex(h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return rgba(lerp(a.r, b.r, t), lerp(a.g, b.g, t), lerp(a.b, b.b, t), 1);
  }
  function shade(hex, amt) {
    var c = hexToRgb(hex);
    if (amt >= 0) return rgba(lerp(c.r, 255, amt), lerp(c.g, 255, amt), lerp(c.b, 255, amt), 1);
    return rgba(c.r * (1 + amt), c.g * (1 + amt), c.b * (1 + amt), 1);
  }

  /* ---------- formatting ---------- */
  function fmtNum(n) {
    n = Math.round(n);
    if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (Math.abs(n) >= 1e4) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }
  function fmtCredits(n) { return fmtNum(n) + ' CR'; }
  function pad(n, len) {
    var s = String(n);
    while (s.length < len) s = '0' + s;
    return s;
  }

  /* ---------- geometry ---------- */
  function pointInPoly(px, py, pts) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function polyRadiusAt(pts, angle) {
    // radius of a star-shaped polygon along a ray at `angle`
    var dx = Math.cos(angle), dy = Math.sin(angle);
    var best = 0;
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      var ex = b.x - a.x, ey = b.y - a.y;
      var den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      var t = (a.x * ey - a.y * ex) / den;             // ray param
      var u = (a.x * dy - a.y * dx) / (dx * ey - dy * ex); // segment param
      if (t > 0 && u >= -0.0001 && u <= 1.0001 && t > best) best = t;
    }
    return best;
  }

  /* ---------- canvas ---------- */
  function makeCanvas(w, h) {
    var c;
    if (typeof document !== 'undefined' && document.createElement) {
      c = document.createElement('canvas');
      c.width = Math.max(1, Math.ceil(w));
      c.height = Math.max(1, Math.ceil(h));
    } else {
      c = new root.SM.SkiaCanvas(Math.max(1, Math.ceil(w)), Math.max(1, Math.ceil(h)));
    }
    return c;
  }

  /* ---------- misc ---------- */
  function pickWeightedRanges(rng, table) { return rng.weighted(table, function (e) { return e.w; }); }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInCubic(t) { return t * t * t; }
  function easeOutBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  SM.U = {
    TAU: TAU, clamp: clamp, lerp: lerp, invLerp: invLerp, smooth: smooth, smoothstep: smoothstep,
    dist: dist, dist2: dist2, sign: sign, round2: round2, angleDiff: angleDiff, angleLerp: angleLerp,
    approach: approach, RNG: RNG, hashStr: hashStr, hexToRgb: hexToRgb, rgba: rgba, hexA: hexA,
    mixHex: mixHex, shade: shade, fmtNum: fmtNum, fmtCredits: fmtCredits, pad: pad,
    pointInPoly: pointInPoly, polyRadiusAt: polyRadiusAt, makeCanvas: makeCanvas,
    pickWeightedRanges: pickWeightedRanges, easeOutCubic: easeOutCubic, easeInCubic: easeInCubic,
    easeOutBack: easeOutBack, easeInOut: easeInOut
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- core/noise.js ---- */
/* =========================================================================
   SPACE MINER — procedural noise (value / fbm / ridged), seeded
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});
  var lerp = SM.U.lerp, smooth = SM.U.smooth;

  function Noise(seed) {
    var RNG = SM.U.RNG;
    var rng = new RNG(seed || 1337);
    this.p = new Uint8Array(512);
    var perm = new Uint8Array(256);
    for (var i = 0; i < 256; i++) perm[i] = i;
    rng.shuffle(perm);
    for (var j = 0; j < 512; j++) this.p[j] = perm[j & 255];
  }

  Noise.prototype.grad = function (h, x, y) {
    switch (h & 7) {
      case 0: return x + y;
      case 1: return -x + y;
      case 2: return x - y;
      case 3: return -x - y;
      case 4: return x;
      case 5: return -x;
      case 6: return y;
      default: return -y;
    }
  };

  // classic 2D perlin in [-1,1]
  Noise.prototype.perlin = function (x, y) {
    var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    var xf = x - Math.floor(x), yf = y - Math.floor(y);
    var u = smooth(xf), v = smooth(yf);
    var p = this.p;
    var aa = p[p[X] + Y], ab = p[p[X] + Y + 1];
    var ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    var x1 = lerp(this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf), u);
    var x2 = lerp(this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v);
  };

  Noise.prototype.fbm = function (x, y, oct, lac, gain) {
    oct = oct || 4; lac = lac || 2; gain = gain === undefined ? 0.5 : gain;
    var sum = 0, amp = 1, norm = 0;
    for (var i = 0; i < oct; i++) {
      sum += this.perlin(x, y) * amp;
      norm += amp;
      amp *= gain; x *= lac; y *= lac;
    }
    return sum / norm;
  };

  Noise.prototype.ridged = function (x, y, oct) {
    oct = oct || 4;
    var sum = 0, amp = 0.5, norm = 0;
    for (var i = 0; i < oct; i++) {
      var n = 1 - Math.abs(this.perlin(x, y));
      sum += n * n * amp;
      norm += amp;
      amp *= 0.5; x *= 2.03; y *= 2.03;
    }
    return sum / norm;
  };

  Noise.prototype.warp = function (x, y, amt) {
    var qx = this.perlin(x * 0.5 + 5.2, y * 0.5 + 1.3);
    var qy = this.perlin(x * 0.5 + 9.7, y * 0.5 + 4.8);
    return this.perlin(x + amt * qx, y + amt * qy);
  };

  SM.Noise = Noise;

</script>
<script>
/* ---- art/theme.js ---- */
/* =========================================================================
   SPACE MINER — visual theme + typography helpers
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});

  var THEME = {
    bg: '#04060b',
    panel: 'rgba(9,18,28,0.92)',
    panelHi: 'rgba(16,32,46,0.94)',
    panelDeep: 'rgba(4,9,15,0.95)',
    line: '#20384b',
    lineHi: '#3d6a8c',
    ink: '#d9edf7',
    inkSoft: '#a8c4d6',
    dim: '#6f8ea4',
    dimmer: '#496274',
    cyan: '#5fe6d8',
    amber: '#ffb257',
    red: '#ff5f6d',
    violet: '#b07dff',
    gold: '#ffd166',
    green: '#8fe27a',
    white: '#ffffff',
    fontBody: '"Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif',
    fontMono: '"JetBrains Mono", "Consolas", "DejaVu Sans Mono", "SF Mono", monospace',
    fontTitle: '"Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif'
  };

  var FONT = {
    body: function (size, weight) {
      return (weight || 400) + ' ' + size + 'px ' + THEME.fontBody;
    },
    mono: function (size, weight) {
      return (weight || 400) + ' ' + size + 'px ' + THEME.fontMono;
    },
    title: function (size, weight) {
      return (weight || 700) + ' ' + size + 'px ' + THEME.fontTitle;
    }
  };

  var measureCache = {};

  /* letter-spaced text. Canvas 2D has no reliable letterSpacing everywhere,
     so glyphs are placed manually. Returns the drawn width. */
  function text(ctx, str, x, y, opt) {
    opt = opt || {};
    var font = opt.font || FONT.body(14);
    var spacing = opt.spacing || 0;
    var align = opt.align || 'left';
    ctx.font = font;
    ctx.textBaseline = opt.baseline || 'alphabetic';
    var key = font + '|' + str;
    var w = measureCache[key];
    if (w === undefined) {
      w = ctx.measureText(str).width;
      measureCache[key] = w;
    }
    var total = w + spacing * Math.max(0, str.length - 1);
    var sx = x;
    if (align === 'center') sx = x - total / 2;
    else if (align === 'right') sx = x - total;
    if (opt.shadow) {
      ctx.save();
      ctx.shadowColor = opt.shadow;
      ctx.shadowBlur = opt.shadowBlur || 12;
      ctx.fillStyle = opt.color || THEME.ink;
      drawSpaced(ctx, str, sx, y, spacing);
      ctx.restore();
    } else {
      ctx.fillStyle = opt.color || THEME.ink;
      drawSpaced(ctx, str, sx, y, spacing);
    }
    return total;
  }

  function drawSpaced(ctx, str, x, y, spacing) {
    if (!spacing) { ctx.fillText(str, x, y); return; }
    var cx = x;
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + spacing;
    }
  }

  function measure(ctx, str, font, spacing) {
    ctx.font = font;
    return ctx.measureText(str).width + (spacing || 0) * Math.max(0, str.length - 1);
  }

  /* Wrap text into lines that fit `maxW`. */
  function wrap(ctx, str, maxW, font) {
    ctx.font = font;
    var words = str.split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  SM.Theme = THEME;
  SM.Font = FONT;
  SM.Text = { draw: text, measure: measure, wrap: wrap, drawSpaced: drawSpaced };

  /** Path helpers used across art + UI **/
  var Path = {
    roundRect: function (ctx, x, y, w, h, r) {
      r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    },
    /* angular panel with clipped corner — the game's signature shape */
    cutRect: function (ctx, x, y, w, h, cut) {
      cut = cut || 12;
      ctx.beginPath();
      ctx.moveTo(x + cut, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h - cut);
      ctx.lineTo(x + w - cut, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + cut);
      ctx.closePath();
    },
    cutRectR: function (ctx, x, y, w, h, cut) {
      cut = cut || 12;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w - cut, y);
      ctx.lineTo(x + w, y + cut);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + cut, y + h);
      ctx.lineTo(x, y + h - cut);
      ctx.closePath();
    },
    polygon: function (ctx, pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
    },
    star4: function (ctx, x, y, r1, r2) {
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var a = (i / 8) * Math.PI * 2 - Math.PI / 2;
        var r = i % 2 ? r2 : r1;
        var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;

      }
      ctx.closePath();
    }
  };
  SM.Path = Path;
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- art/background.js ---- */
/* =========================================================================
   SPACE MINER — procedural sector backdrops (nebula / stars / planets)
   Rendered once per sector into an offscreen canvas, then parallax-scrolled.
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});
  var U = SM.U, makeCanvas = U.makeCanvas, hexA = U.hexA, lerp = U.lerp;
  var Path = SM.Path;

  var BW = 2048, BH = 1280;

  function blob(ctx, x, y, r, color, alpha, comp) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hexA(color, alpha));
    g.addColorStop(0.45, hexA(color, alpha * 0.42));
    g.addColorStop(1, hexA(color, 0));
    ctx.globalCompositeOperation = comp || 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function softEllipse(ctx, x, y, rx, ry, rot, color, alpha, comp) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(1, ry / rx);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, hexA(color, alpha));
    g.addColorStop(0.55, hexA(color, alpha * 0.3));
    g.addColorStop(1, hexA(color, 0));
    ctx.globalCompositeOperation = comp || 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function star(ctx, x, y, size, color, alpha) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(color, alpha);
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  function flare(ctx, x, y, len, color, alpha) {
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x, y, 0, x, y, len);
    g.addColorStop(0, hexA(color, alpha));
    g.addColorStop(0.25, hexA(color, alpha * 0.35));
    g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, len, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha * 0.85;
    var lg = ctx.createLinearGradient(-len, 0, len, 0);
    lg.addColorStop(0, hexA(color, 0));
    lg.addColorStop(0.5, hexA(color, 1));
    lg.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(-len, -0.7, len * 2, 1.4);
    ctx.fillRect(-0.7, -len * 0.62, 1.4, len * 1.24);
    ctx.restore();
  }

  /**
   * Build the entire sector backdrop. Deterministic per sector id.
   */
  function build(sector, seed) {
    var rng = new U.RNG(seed || U.hashStr(sector.id) ^ 0x51ab);
    var noise = new SM.Noise(seed || U.hashStr(sector.id));
    var c = makeCanvas(BW, BH);
    var ctx = c.getContext('2d');
    var pal = sector.palette;

    // --- deep space gradient ------------------------------------------------
    var g = ctx.createLinearGradient(0, 0, BW * 0.35, BH);
    g.addColorStop(0, pal.deep);
    g.addColorStop(0.45, pal.mid);
    g.addColorStop(1, pal.deep);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, BW, BH);

    // --- distant galactic band ---------------------------------------------
    ctx.save();
    ctx.translate(BW * 0.5, BH * 0.52);
    ctx.rotate(-0.42);
    for (var i = 0; i < 26; i++) {

  function drawStation(ctx) {
    // outer ring
    ctx.save();
    ctx.strokeStyle = 'rgba(120,170,200,0.20)';
    ctx.lineWidth = 22;
    ctx.beginPath(); ctx.arc(0, 0, 150, 0, 6.2832); ctx.stroke();

    ctx.beginPath(); ctx.arc(0, 0, 162, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 138, 0, 6.2832); ctx.stroke();
    // ring segments
    for (var i = 0; i < 24; i++) {
      var a = i / 24 * 6.2832;
      ctx.strokeStyle = i % 2 ? 'rgba(90,140,170,0.25)' : 'rgba(150,200,230,0.30)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 138, Math.sin(a) * 138);
      ctx.lineTo(Math.cos(a) * 162, Math.sin(a) * 162);
      ctx.stroke();
    }
    ctx.restore();

    // spokes
    for (var s = 0; s < 4; s++) {
      ctx.save();
      ctx.rotate(s * Math.PI / 2 + Math.PI / 4);
      ctx.fillStyle = lin(ctx, 0, -8, 150, 8, [[0, '#2c3b47'], [0.5, '#7a91a2'], [1, '#33434f']]);
      ctx.fillRect(40, -8, 100, 16);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeRect(40, -8, 100, 16);
      ctx.fillStyle = 'rgba(255,178,87,0.7)';
      for (var l = 0; l < 6; l++) ctx.fillRect(50 + l * 15, -8, 3, 3);
      ctx.restore();
    }

    // core hull
    var hull = [];
    for (var h = 0; h < 12; h++) {
      var ang = h / 12 * 6.2832;
      var r = h % 2 ? 46 : 54;
      hull.push([Math.cos(ang) * r, Math.sin(ang) * r]);
    }
    poly(ctx, hull, lin(ctx, 0, -56, 0, 56, [[0, '#8ea3b3'], [0.4, '#576a79'], [1, '#232e37']]),
      'rgba(0,0,0,0.8)', 2);
    // docking arms
    [-1, 1].forEach(function (sg) {
      poly(ctx, [[-10, sg * 46], [10, sg * 46], [14, sg * 78], [0, sg * 92], [-14, sg * 78]],
        lin(ctx, 0, sg * 46, 0, sg * 92, [[0, '#4a5c6a'], [1, '#8fa6b6']]), 'rgba(0,0,0,0.75)', 1.4);
      ctx.fillStyle = 'rgba(255,178,87,0.8)';
      for (var d = 0; d < 4; d++) ctx.fillRect(-10, sg * (58 + d * 8), 20, 2);
    });
    // central dome
    var dg = ctx.createRadialGradient(-12, -14, 4, 0, 0, 40);
    dg.addColorStop(0, '#dff2ff');
    dg.addColorStop(0.4, '#7c98ab');
    dg.addColorStop(1, '#26333d');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.6; ctx.stroke();
    // windows
    for (var w = 0; w < 14; w++) {
      var wa = w / 14 * 6.2832;
      ctx.fillStyle = 'rgba(255,215,150,0.85)';
      ctx.beginPath();
      ctx.arc(Math.cos(wa) * 24, Math.sin(wa) * 24, 2.2, 0, 6.2832);
      ctx.fill();
    }
    // beacon
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var bg = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
    bg.addColorStop(0, 'rgba(255,235,200,0.9)');
    bg.addColorStop(0.4, 'rgba(255,178,87,0.35)');
    bg.addColorStop(1, 'rgba(255,178,87,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, 6.2832); ctx.fill();
    ctx.restore();

    // solar panels
    [[-1, -1], [1, 1], [1, -1], [-1, 1]].forEach(function (q, i) {
      if (i > 2) return;
      ctx.save();
      ctx.translate(q[0] * 96, q[1] * 96);

      ctx.fillRect(-26, -14, 52, 28);
      ctx.strokeStyle = 'rgba(120,180,220,0.5)';

        ctx.beginPath(); ctx.moveTo(-26, -14 + g2 * 7); ctx.lineTo(26, -14 + g2 * 7); ctx.stroke();
      }
      ctx.strokeRect(-26, -14, 52, 28);
      ctx.restore();
    });

<script>
/* ---- game/profile.js ---- */
/* =========================================================================
   SPACE MINER — player profile: progression, derived stats, save/load.
   Pure logic, no rendering — used by the game and by the headless tests.
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});
  var U = SM.U;

  var SAVE_VERSION = 4;
  var SAVE_KEY = 'spaceminer.save.v4';
  var BACKUP_KEY = 'spaceminer.save.backup';
  var SETTINGS_KEY = 'spaceminer.settings';

  function emptyCounters() {
    return {
      asteroidsMined: 0, creditsEarned: 0, kills: 0, droneMined: 0,
      minedByType: {}, upgradesBought: 0, fullHolds: 0, playTime: 0,
      maxDrones: 0, deaths: 0, distance: 0, sectorsVisited: 0, runs: 0
    };
  }

  function create() {
    var p = {
      v: SAVE_VERSION,
      credits: 500,
      xp: 0,
      level: 1,
      shipId: 'prospector',
      ships: ['prospector'],
      sector: 'belt',
      sectors: ['belt'],
      upgrades: {},
      cargo: {},
      drones: [{ serial: 1, mined: 0 }],
      achievements: [],
      counters: emptyCounters(),
      settings: { sfx: true, music: true, shake: true, quality: 1, showHints: true },
      seen: {},
      playTime: 0,
      lastSaved: 0
    };
    SM.Upgrades.list.forEach(function (u) { p.upgrades[u.id] = 0; });
    return p;
  }

  function xpForLevel(level) {
    return Math.round(85 * Math.pow(level, 1.42));
  }

  function totalXpForLevel(level) {
    var t = 0;
    for (var i = 1; i < level; i++) t += xpForLevel(i);
    return t;
  }

  function resolveLevel(p) {
    var lvl = 1;
    while (lvl < 40 && p.xp >= totalXpForLevel(lvl + 1)) lvl++;
    p.level = lvl;
    return lvl;
  }

  /* ---------------- derived statistics ---------------- */
  var statsCache = { key: '', value: null };

  function stats(p) {
    var key = p.shipId + '|' + p.level;
    for (var id in p.upgrades) key += '|' + id + p.upgrades[id];
    if (statsCache.key === key && statsCache.value) return statsCache.value;

    var base = SM.Ships.get(p.shipId).stats;
    var s = {};
    for (var k in base) s[k] = base[k];

    SM.Upgrades.list.forEach(function (u) {
      var lvl = p.upgrades[u.id] | 0;
      if (lvl > 0) u.apply(s, lvl);
    });

    // every 5 pilot levels grant a small all-round bonus (real, documented)
    var lv = Math.max(0, (p.level | 0) - 1);
    s.maxHull *= 1 + lv * 0.012;
    s.maxShield *= 1 + lv * 0.012;
    s.laserPower *= 1 + lv * 0.015;
    s.weaponDamage *= 1 + lv * 0.015;

    // drone count follows ship cradles + drone-bay upgrades, capped
    s.droneSlots = Math.min(6, Math.round(base.droneSlots + (p.upgrades.droneBay | 0)));
    s.maxHull = Math.round(s.maxHull);
    s.maxShield = Math.round(s.maxShield);
    s.maxEnergy = Math.round(s.maxEnergy);
    s.cargoCap = Math.round(s.cargoCap);

    statsCache.key = key;
    statsCache.value = s;
    return s;
  }

  function invalidateStats() { statsCache.key = ''; statsCache.value = null; }

  /* ---------------- cargo ---------------- */
  function cargoUsed(p) {
    var s = stats(p), total = 0;
    for (var id in p.cargo) {
      var q = p.cargo[id] | 0;
      if (q <= 0) continue;
      var r = SM.Resources.get(id);
      if (!r) continue;
      total += q * r.mass * s.massFactor;
    }
    return total;
  }
  function cargoCap(p) { return stats(p).cargoCap; }
  function cargoFree(p) { return Math.max(0, cargoCap(p) - cargoUsed(p)); }

  function addResource(p, id, qty) {
    var r = SM.Resources.get(id);
    if (!r) return 0;
    var s = stats(p);
    var per = r.mass * s.massFactor;
    var free = cargoFree(p);
    var canFit = per > 0 ? Math.floor(free / per + 1e-6) : qty;
    var added = Math.min(qty, Math.max(0, canFit));
    if (added <= 0) return 0;
    p.cargo[id] = (p.cargo[id] | 0) + added;
    p.counters.minedByType[id] = (p.counters.minedByType[id] | 0) + added;
    if (cargoFree(p) <= 0.001) p.counters.fullHolds++;
    return added;
  }

  function cargoValue(p) {
    var total = 0;
    for (var id in p.cargo) {
      var r = SM.Resources.get(id);
      if (!r) continue;
      total += (p.cargo[id] | 0) * r.value;
    }
    return total;
  }

  function sellAll(p) {
    var total = cargoValue(p);
    p.credits += total;
    p.counters.creditsEarned += total;
    p.cargo = {};
    return total;
  }

  function sellResource(p, id) {
    var r = SM.Resources.get(id);
    if (!r || !p.cargo[id]) return 0;
    var total = p.cargo[id] * r.value;
    p.credits += total;
    p.counters.creditsEarned += total;
    delete p.cargo[id];
    return total;
  }

  /* ---------------- purchases ---------------- */
  function upgradeLevel(p, id) { return p.upgrades[id] | 0; }
  function upgradeCost(p, id) {
    var u = SM.Upgrades.get(id);
    if (!u) return 0;
    var lvl = upgradeLevel(p, id);
    if (lvl >= u.max) return 0;
    return u.cost(lvl);
  }

  function buyUpgrade(p, id, freeMode) {
    var u = SM.Upgrades.get(id);
    if (!u) return { ok: false, reason: 'unknown' };
    var lvl = upgradeLevel(p, id);
    if (lvl >= u.max) return { ok: false, reason: 'max' };
    var cost = u.cost(lvl);
    if (!freeMode && p.credits < cost) return { ok: false, reason: 'credits', cost: cost };
    if (!freeMode) p.credits -= cost;
    p.upgrades[id] = lvl + 1;
    p.counters.upgradesBought++;
    invalidateStats();
    syncDrones(p);
    return { ok: true, cost: cost, level: lvl + 1 };
  }

  function shipOwned(p, id) { return p.ships.indexOf(id) >= 0; }
  function buyShip(p, id, freeMode) {
    var ship = SM.Ships.get(id);
    if (!ship) return { ok: false, reason: 'unknown' };
    if (shipOwned(p, id)) return { ok: false, reason: 'owned' };
    if (p.level < ship.levelReq) return { ok: false, reason: 'level', need: ship.levelReq };
    if (p.credits < ship.cost && !freeMode) return { ok: false, reason: 'credits', cost: ship.cost };
    if (!freeMode) p.credits -= ship.cost;
    p.ships.push(id);
    return { ok: true };
  }

  function selectShip(p, id) {
    if (!shipOwned(p, id)) return false;
    p.shipId = id;
    invalidateStats();
    syncDrones(p);
    return true;
  }

  function syncDrones(p) {
    var want = stats(p).droneSlots;
    while (p.drones.length < want) {
      p.drones.push({ serial: p.drones.length + 1, mined: 0 });
    }
    if (p.drones.length > want) p.drones.length = want;
    p.counters.maxDrones = Math.max(p.counters.maxDrones, p.drones.length);
  }

  /* ---------------- sectors ---------------- */
  function sectorUnlocked(p, id) { return p.sectors.indexOf(id) >= 0; }

  function canUnlock(p, id) {
    var sec = SM.Sectors.get(id);
    if (!sec) return { ok: false, reason: 'unknown' };
    if (sectorUnlocked(p, id)) return { ok: false, reason: 'owned' };
    if (p.credits < sec.unlock.credits) return { ok: false, reason: 'credits', need: sec.unlock.credits };
    var missing = {};
    var missingAny = false;
    for (var rid in sec.unlock.deliver) {
      var need = sec.unlock.deliver[rid];
      var have = p.cargo[rid] | 0;
      if (have < need) { missing[rid] = need - have; missingAny = true; }
    }
    if (missingAny) return { ok: false, reason: 'deliver', missing: missing };
    return { ok: true };
  }

  function unlockSector(p, id, freeMode) {
    var check = canUnlock(p, id);
    if (!check.ok) return check;
    var sec = SM.Sectors.get(id);
    if (!freeMode) p.credits -= sec.unlock.credits;
    for (var rid in sec.unlock.deliver) {
      p.cargo[rid] = (p.cargo[rid] | 0) - sec.unlock.deliver[rid];
      if (p.cargo[rid] <= 0) delete p.cargo[rid];
    }
    p.sectors.push(id);
    p.counters.sectorsVisited = p.sectors.length;
    return { ok: true };
  }

  /* ---------------- xp / achievements ---------------- */
  function addXp(p, amt) {
    p.xp += Math.max(0, amt); // xp stored as lifetime total
    var before = p.level;
    resolveLevel(p);
    return p.level > before ? p.level : 0;
  }

  function railLevelProgress(p) {
    var cur = totalXpForLevel(p.level);
    var next = totalXpForLevel(p.level + 1);
    return { cur: p.xp - cur, need: next - cur, pct: U.clamp((p.xp - cur) / Math.max(1, next - cur), 0, 1) };
  }

  function checkAchievements(p) {
    var unlocked = [];
    SM.Achievements.list.forEach(function (a) {
      if (p.achievements.indexOf(a.id) >= 0) return;
      var ok = false;
      try { ok = !!a.test(p); } catch (e) { ok = false; }
      if (ok) {
        p.achievements.push(a.id);
        p.credits += a.reward;
        p.counters.creditsEarned += a.reward;
        unlocked.push(a);
      }
    });
    return unlocked;
  }

  /* ---------------- serialisation ---------------- */
  function checksum(payload) {
    var s = JSON.stringify(payload);
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  function serialize(p) {
    var payload = {
      credits: Math.round(p.credits),
      xp: p.xp, level: p.level,
      shipId: p.shipId, ships: p.ships.slice(),
      sector: p.sector, sectors: p.sectors.slice(),
      upgrades: p.upgrades, cargo: p.cargo,
      drones: p.drones,
      achievements: p.achievements.slice(),
      counters: p.counters,
      settings: p.settings,
      seen: p.seen,
      playTime: Math.round(p.playTime),
      lastSaved: Date.now()
    };
    return JSON.stringify({ v: SAVE_VERSION, sum: checksum(payload), data: payload });
  }

  function num(v, def, lo, hi) {
    v = Number(v);
    if (!isFinite(v)) return def;
    return U.clamp(v, lo, hi);
  }

  function deserialize(json) {
    var parsed;
    try { parsed = JSON.parse(json); } catch (e) { return { ok: false, reason: 'json' }; }
    if (!parsed || typeof parsed !== 'object') return { ok: false, reason: 'shape' };
    if (parsed.v > SAVE_VERSION) return { ok: false, reason: 'future-version' };
    var d = parsed.data;
    if (!d || typeof d !== 'object') return { ok: false, reason: 'data' };
    if (parsed.sum && checksum(d) !== parsed.sum) return { ok: false, reason: 'checksum' };

    var p = create();
    p.credits = num(d.credits, 500, 0, 1e12);
    p.xp = num(d.xp, 0, 0, 1e12);
    p.level = 1;
    resolveLevel(p);

    if (SM.Ships.get(d.shipId) && d.shipId) p.shipId = d.shipId;
    p.ships = ['prospector'];
    (Array.isArray(d.ships) ? d.ships : []).forEach(function (id) {
      if (SM.Ships.get(id) && p.ships.indexOf(id) < 0) p.ships.push(id);
    });
    if (p.ships.indexOf(p.shipId) < 0) p.shipId = 'prospector';

    p.sectors = ['belt'];
    (Array.isArray(d.sectors) ? d.sectors : []).forEach(function (id) {
      if (SM.Sectors.byId[id] && p.sectors.indexOf(id) < 0) p.sectors.push(id);
    });
    p.sector = SM.Sectors.byId[d.sector] ? d.sector : 'belt';
    if (p.sectors.indexOf(p.sector) < 0) p.sector = 'belt';

    if (d.upgrades && typeof d.upgrades === 'object') {
      Object.keys(d.upgrades).forEach(function (id) {
        var u = SM.Upgrades.get(id);
        if (!u) return;
        p.upgrades[id] = Math.floor(num(d.upgrades[id], 0, 0, u.max));
      });
    }
    if (d.cargo && typeof d.cargo === 'object') {
      Object.keys(d.cargo).forEach(function (id) {
        if (!SM.Resources.get(id)) return;
        var q = Math.floor(num(d.cargo[id], 0, 0, 1e7));
        if (q > 0) p.cargo[id] = q;
      });
    }
    if (Array.isArray(d.drones)) {
      p.drones = d.drones.slice(0, 6).map(function (dr, i) {
        return { serial: num(dr && dr.serial, i + 1, 1, 999), mined: Math.floor(num(dr && dr.mined, 0, 0, 1e9)) };
      });
    }
    if (Array.isArray(d.achievements)) {
      d.achievements.forEach(function (id) {
        if (SM.Achievements.get(id) && p.achievements.indexOf(id) < 0) p.achievements.push(id);
      });
    }
    var c = d.counters || {};
    var base = emptyCounters();
    Object.keys(base).forEach(function (k) {
      if (k === 'minedByType') {
        if (c.minedByType && typeof c.minedByType === 'object') {
          Object.keys(c.minedByType).forEach(function (rid) {
            if (SM.Resources.get(rid)) p.counters.minedByType[rid] = Math.floor(num(c.minedByType[rid], 0, 0, 1e9));
          });
        }
      } else {
        p.counters[k] = Math.floor(num(c[k], 0, 0, 1e12));
      }
    });
    if (d.settings && typeof d.settings === 'object') {
      ['sfx', 'music', 'shake', 'showHints'].forEach(function (k) {
        if (typeof d.settings[k] === 'boolean') p.settings[k] = d.settings[k];
      });
      p.settings.quality = U.clamp(num(d.settings.quality, 1, 0, 1), 0, 1);
    }
    if (d.seen && typeof d.seen === 'object') p.seen = d.seen;
    p.playTime = num(d.playTime, 0, 0, 1e9);
    p.lastSaved = num(d.lastSaved, 0, 0, 1e15);

    resolveLevel(p);
    invalidateStats();
    syncDrones(p);
    return { ok: true, profile: p };
  }

  /* ---------------- storage helpers ---------------- */
  var mem = {};
  function storage() {
    if (root.localStorage) return root.localStorage;
    if (!mem.__store) mem.__store = {};
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem.__store, k) ? mem.__store[k] : null; },
      setItem: function (k, v) { mem.__store[k] = String(v); },
      removeItem: function (k) { delete mem.__store[k]; }
    };
  }

  function save(p) {
    var json = serialize(p);
    try {
      var st = storage();
      var prev = st.getItem(SAVE_KEY);
      if (prev) st.setItem(BACKUP_KEY, prev);
      st.setItem(SAVE_KEY, json);
      p.lastSaved = Date.now();
      return { ok: true, bytes: json.length };
    } catch (e) {
      return { ok: false, error: String(e && e.message || e) };
    }
  }

  function load() {
    var st = storage();
    var raw = null, where = SAVE_KEY;
    try { raw = st.getItem(SAVE_KEY); } catch (e) { raw = null; }
    if (!raw) {
      try { raw = st.getItem(BACKUP_KEY); where = BACKUP_KEY; } catch (e) { raw = null; }
      if (!raw) return { ok: false, reason: 'empty' };
    }
    var res = deserialize(raw);
    if (!res.ok) {
      // keep the broken file for diagnostics, then try the previous one
      try { st.setItem('spaceminer.save.corrupt', raw); } catch (e) {}
      if (where === SAVE_KEY) {
        var backup = null;
        try { backup = st.getItem(BACKUP_KEY); } catch (e) {}
        if (backup) {
          var res2 = deserialize(backup);
          if (res2.ok) { res2.recovered = true; return res2; }
        }
      }
      return res;
    }
    res.source = where;
    return res;
  }

  function wipe() {
    var st = storage();
    try { st.removeItem(SAVE_KEY); st.removeItem(BACKUP_KEY); } catch (e) {}
  }

  function saveSettings(settings) {
    try { storage().setItem(SETTINGS_KEY, JSON.stringify(settings)); return true; } catch (e) { return false; }
  }
  function loadSettings() {
    try {
      var raw = storage().getItem(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  SM.Profile = {
    SAVE_VERSION: SAVE_VERSION, SAVE_KEY: SAVE_KEY, BACKUP_KEY: BACKUP_KEY,
    create: create, stats: stats, invalidateStats: invalidateStats,
    xpForLevel: xpForLevel, totalXpForLevel: totalXpForLevel, resolveLevel: resolveLevel, addXp: addXp,
    levelProgress: railLevelProgress,
    cargoUsed: cargoUsed, cargoCap: cargoCap, cargoFree: cargoFree,
    addResource: addResource, cargoValue: cargoValue, sellAll: sellAll, sellResource: sellResource,
    upgradeLevel: upgradeLevel, upgradeCost: upgradeCost, buyUpgrade: buyUpgrade,
    shipOwned: shipOwned, buyShip: buyShip, selectShip: selectShip, syncDrones: syncDrones,
    sectorUnlocked: sectorUnlocked, canUnlock: canUnlock, unlockSector: unlockSector,
    checkAchievements: checkAchievements,
    serialize: serialize, deserialize: deserialize, save: save, load: load, wipe: wipe,
    saveSettings: saveSettings, loadSettings: loadSettings, storage: storage
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* =========================================================================
   SPACE MINER — pooled particle system (sparks, smoke, debris, rings, text)
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});
  var U = SM.U;

  function Particles(max) {
    this.list = [];
    this.max = max || 900;
    this.beams = [];
    this.rings = [];
  }

  Particles.prototype.add = function (p) {
    if (this.list.length >= this.max) return null;
    p.life = p.life || 0.5;
    p.maxLife = p.maxLife || p.life;
    p.size = p.size || 2;
    p.color = p.color || '#ffffff';
    p.type = p.type || 'spark';
    p.vx = p.vx || 0; p.vy = p.vy || 0;
    p.drag = p.drag === undefined ? 1.6 : p.drag;
    p.grav = p.grav || 0;
    p.rot = p.rot || 0;
    p.vr = p.vr || 0;
    p.alpha = p.alpha === undefined ? 1 : p.alpha;
    this.list.push(p);
    return p;
  };

  Particles.prototype.burst = function (x, y, n, opt) {
    opt = opt || {};
    var spd = opt.speed || 120;
    var spread = opt.spread === undefined ? Math.PI * 2 : opt.spread;
    var dir = opt.angle === undefined ? 0 : opt.angle;
    for (var i = 0; i < n; i++) {
      var a = dir + (Math.random() - 0.5) * spread;
      var s = spd * (0.35 + Math.random() * 0.9);
      this.add({
        x: x + (Math.random() - 0.5) * (opt.jitter || 0),
        y: y + (Math.random() - 0.5) * (opt.jitter || 0),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: (opt.life || 0.6) * (0.6 + Math.random() * 0.8),
        maxLife: opt.life || 0.6,
        size: (opt.size || 2) * (0.6 + Math.random() * 0.9),
        color: opt.color || '#ffffff',
        type: opt.type || 'spark',
        drag: opt.drag === undefined ? 1.4 : opt.drag,
        grav: opt.grav || 0,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 12

    };

    this.bg = SM.Art.background(this.sector, this.seed);
    this.stars1 = SM.Art.starLayer(this.seed ^ 0x1234, 320, 2400, this.sector.palette);
    this.stars2 = SM.Art.starLayer(this.seed ^ 0x9876, 180, 2400, this.sector.palette);
    this.dust = SM.Art.dustLayer(this.seed ^ 0xbeef, 130, 2600, this.sector.palette);

    this.populate();
  }

  /* =======================  POPULATION  ============================== */
  World.prototype.pickResource = function () {
    var rng = this.rng;
    var weights = this.sector.asteroid.mineralWeights;
    var stats = this.stats;
    var rare = [];
    Object.keys(weights).forEach(function (id) {
      var r = SM.Resources.get(id);
      var w = weights[id];
      if (!r) return;
      var bias = 1;
      if (stats.rareFind > 0 && r.tier >= 8) bias = 1 + stats.rareFind * 3.4;
      rare.push({ id: id, w: w * bias });
    });
    return rng.weighted(rare, function (e) { return e.w; }).id;
  };

  World.prototype.positionFree = function (x, y, radius) {
    if (x < radius + 40 || y < radius + 40 || x > WORLD_W - radius - 40 || y > WORLD_H - radius - 40) return false;
    if (U.dist(x, y, this.player.x, this.player.y) < radius + 190) return false;
    if (U.dist(x, y, this.station.x, this.station.y) < radius + 200) return false;
    for (var i = 0; i < this.asteroids.length; i++) {
      var a = this.asteroids[i];
      if (U.dist(x, y, a.x, a.y) < radius + a.radius + 26) return false;
    }
    return true;
  };

  World.prototype.addAsteroid = function (opts) {
    var a = Ent.makeAsteroid(this, opts);
    a.dead = false;
    this.asteroids.push(a);
    return a;
  };

  World.prototype.spawnAsteroid = function (opts) {
    opts = opts || {};
    var rng = this.rng;
    var radius = opts.radius || rng.range(this.sector.asteroid.sizeMin, this.sector.asteroid.sizeMax);
    var family = opts.family || rng.pick(this.sector.asteroid.families);
    var resource = opts.resource || this.pickResource();

    for (var attempt = 0; attempt < 60; attempt++) {
      var x, y;
      if (attempt < 40) {
        x = rng.range(100, WORLD_W - 100);
        y = rng.range(100, WORLD_H - 100);
      } else {
        // widen out: bias to areas away from the player
        var ang = rng.range(0, TAU);
        var d = rng.range(520, Math.max(700, Math.min(WORLD_W, WORLD_H) * 0.45));
        x = U.clamp(this.player.x + Math.cos(ang) * d, 120, WORLD_W - 120);
        y = U.clamp(this.player.y + Math.sin(ang) * d, 120, WORLD_H - 120);
      }
      if (opts.x !== undefined && opts.y !== undefined) { x = opts.x; y = opts.y; }
      if (!this.positionFree(x, y, radius)) {
        if (opts.x !== undefined) { radius *= 0.8; if (radius < 16) return null; continue; }
        continue;
      }
      return this.addAsteroid({
        x: x, y: y, radius: radius, family: family, resource: resource,
        vx: rng.range(-7, 7), vy: rng.range(-7, 7), variant: rng.int(0, 7)
      });
    }
    return null;
  };

  World.prototype.populate = function () {
    var i;
    var count = this.sector.asteroid.density;
    for (i = 0; i < count; i++) this.spawnAsteroid();

    // a couple of rich, hand-placed rocks near the station to get started
    for (i = 0; i < 7; i++) {
      var ang = this.rng.range(0, TAU);
      var d = this.rng.range(260, 560);
      var a = this.spawnAsteroid({
        radius: this.rng.range(46, 70),
        resource: i === 0 ? 'iron' : i === 1 ? 'silicate' : this.pickResource()
      });
      if (a) { a.rich = true; a.hp *= 1.15; }
    }

    // initial hostiles
    var n = Math.min(2, this.sector.enemies.max);
    for (i = 0; i < n; i++) {
      var e = this.spawnEnemy(this.randomSpawnPoint(900, 1400));
      if (e) e.spawnT = 0;
    }

    // drones
    this.rebuildDrones();

    this.setupHazards();
  };

  World.prototype.rebuildDrones = function () {
    this.drones.length = 0;
    this.droneCount = this.stats.droneSlots;
    for (var i = 0; i < this.droneCount; i++) {
      var dr = Ent.makeDrone(this, i, (this.profile.drones[i] && this.profile.drones[i].serial) || i + 1);
      dr.slot = i;
      this.drones.push(dr);
    }
  };

  World.prototype.randPoint = function () {
    return { x: this.rng.range(150, WORLD_W - 150), y: this.rng.range(150, WORLD_H - 150) };
  };

  World.prototype.randomSpawnPoint = function (minD, maxD) {
    var p = this.player;
    for (var i = 0; i < 40; i++) {
      var a = this.rng.range(0, TAU);
      var d = this.rng.range(minD || 700, maxD || 1300);
      var x = U.clamp(p.x + Math.cos(a) * d, 90, WORLD_W - 90);
      var y = U.clamp(p.y + Math.sin(a) * d, 90, WORLD_H - 90);
      var blocked = false;
      for (var k = 0; k < this.asteroids.length; k++) {
        var as = this.asteroids[k];
        if (U.dist(x, y, as.x, as.y) < as.radius + 60) { blocked = true; break; }
      }
      if (!blocked && U.dist(x, y, p.x, p.y) > 520) return { x: x, y: y };
    }
    return { x: U.clamp(p.x + 900, 90, WORLD_W - 90), y: p.y };
  };

  World.prototype.setupHazards = function () {
    var h = this.sector.hazard;
    this.storms.length = 0;
    this.wells.length = 0;
    this.debris.length = 0;
    this.hazardTimer = h.kind === 'storm' ? 3 : 0;
    if (h.kind === 'gravity') {
      var n = 2 + Math.round(h.intensity);
      for (var i = 0; i < n; i++) {
        var pt = this.randPoint();
        this.wells.push({ x: pt.x, y: pt.y, r: this.rng.range(380, 620), strength: this.rng.range(180, 320) * h.intensity, phase: this.rng.range(0, TAU) });
      }
    }
    if (h.kind === 'debris') {
      for (var d = 0; d < 26; d++) this.spawnDebris();
    }
  };

  World.prototype.spawnDebris = function () {
    var rng = this.rng;
    var side = rng.int(0, 3);
    var x, y;
    if (side === 0) { x = rng.range(0, WORLD_W); y = -30; }
    else if (side === 1) { x = WORLD_W + 30; y = rng.range(0, WORLD_H); }
    else if (side === 2) { x = rng.range(0, WORLD_W); y = WORLD_H + 30; }
    else { x = -30; y = rng.range(0, WORLD_H); }
    var ang = Math.atan2(WORLD_H / 2 - y, WORLD_W / 2 - x) + rng.range(-0.5, 0.5);
    var sp = rng.range(60, 150);
    this.debris.push({
      x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      r: rng.range(9, 26), rot: rng.range(0, TAU), vr: rng.range(-2, 2),
      dmg: rng.range(4, 9), hitCd: 0, shape: rng.int(0, 2)
    });
  };

  /* =======================  EFFECTS / FEEDBACK  ====================== */
  World.prototype.notify = function (text, kind, ttl) {
    this.toasts.push({ text: text, kind: kind || 'info', life: ttl || 2.6, maxLife: ttl || 2.6 });
    if (this.toasts.length > 5) this.toasts.shift();
  };

  World.prototype.sfx = function (name, x, y, vol) {
    if (this.game && this.game.audio) this.game.audio.play(name, x, y, vol, this.player, this.game.camera);
  };

  World.prototype.shake = function (amt) {
    if (this.game && this.game.addShake) this.game.addShake(amt);
  };

  /* =======================  MINING  ================================= */
  World.prototype.asteroidAt = function (x, y, pad) {
    for (var i = 0; i < this.asteroids.length; i++) {
      var a = this.asteroids[i];
      if (a.dead) continue;
      var r = a.radius * 0.94 + (pad || 0);
      if (U.dist2(x, y, a.x, a.y) <= r * r) return a;
    }
    return null;
  };

  /* nearest asteroid hit by a ray; returns {asteroid, x, y, dist} */
  World.prototype.raycastAsteroids = function (x0, y0, dx, dy, maxDist) {
    var best = null;
    for (var i = 0; i < this.asteroids.length; i++) {
      var a = this.asteroids[i];
      if (a.dead) continue;
      var ox = a.x - x0, oy = a.y - y0;
      var proj = ox * dx + oy * dy;
      if (proj < -a.radius || proj > maxDist + a.radius) continue;
      var perp2 = ox * ox + oy * oy - proj * proj;
      var rr = a.radius * 0.92;
      if (perp2 > rr * rr) continue;
      var hitT = proj - Math.sqrt(Math.max(0, rr * rr - perp2));
      if (hitT < 0) hitT = 0;
      if (hitT > maxDist) continue;
      if (!best || hitT < best.dist) {
        best = {
          asteroid: a,
          dist: hitT,
          x: x0 + dx * hitT,
          y: y0 + dy * hitT
        };
      }
    }
    return best;
  };

  World.prototype.mineAsteroid = function (a, dmg, source, dr) {
    if (!a || a.dead) return;
    var res = SM.Resources.get(a.resourceId);
    var hardness = res.hardness;
    if (!a.hardnessApplied) a.hardnessApplied = true;
    var eff = dmg / (0.55 + hardness * 0.12);
    if (source === 'player') eff *= this.stats.penetration;
    a.hp -= eff;
    a.damagePct = U.clamp(1 - a.hp / a.maxHp, 0, 1);
    a.hitFlash = Math.min(1, a.hitFlash + eff * 0.06);

    // sparks at the impact point
    if (this.rng.chance(0.55)) {
      var ang = this.rng.range(0, TAU);
      this.particles.add({
        x: a.x + Math.cos(ang) * a.radius * 0.9,
        y: a.y + Math.sin(ang) * a.radius * 0.9,
        vx: Math.cos(ang) * this.rng.range(40, 170),
        vy: Math.sin(ang) * this.rng.range(40, 170),
        life: this.rng.range(0.2, 0.5), maxLife: 0.5,
        size: this.rng.range(1, 2.6),
        color: this.rng.chance(0.6) ? res.color : '#ffe6b0',
        type: 'spark', drag: 2.2
      });
    }
    if (a.hp <= 0) this.destroyAsteroid(a, source);
  };

  World.prototype.destroyAsteroid = function (a, source) {
    if (a.dead) return;
    a.dead = true;
    var idx = this.asteroids.indexOf(a);
    if (idx >= 0) this.asteroids.splice(idx, 1);

    var res = SM.Resources.get(a.resourceId);
    var p = this.profile;
    var stats = this.stats;

    // ---- ore
    var qty = a.richness;
    var bonus = 0;
    if (this.rng.chance(0.12 + stats.rareFind * 0.5)) bonus = this.rng.int(1, 3);
    var total = qty + bonus;
    var chunks = U.clamp(Math.round(total / 2.2), 2, 7);
    var remaining = total;
    for (var i = 0; i < chunks; i++) {
      var q = i === chunks - 1 ? remaining : Math.max(1, Math.round(total / chunks));
      remaining -= q;
      if (q <= 0) continue;
      var ang = this.rng.range(0, TAU);
      var sp = this.rng.range(45, 135);
      var px = a.x + Math.cos(ang) * a.radius * this.rng.range(0.1, 0.7);
      var py = a.y + Math.sin(ang) * a.radius * this.rng.range(0.1, 0.7);
      this.pickups.push(Ent.makePickup(this, px, py, a.resourceId, q,
        Math.cos(ang) * sp + a.vx, Math.sin(ang) * sp + a.vy));
    }

    // ---- effects
    var col = res.color;
    this.particles.burst(a.x, a.y, 26, { color: col, speed: 180, size: 2.6, life: 0.8, type: 'spark' });
    this.particles.burst(a.x, a.y, 14, { color: '#c9b7a5', speed: 120, size: 3.4, life: 1.1, type: 'smoke', drag: 0.8 });
    for (var f = 0; f < 14; f++) {
      var fa = this.rng.range(0, TAU), fs = this.rng.range(40, 220);
      this.particles.add({
        x: a.x + this.rng.range(-a.radius * 0.6, a.radius * 0.6),
        y: a.y + this.rng.range(-a.radius * 0.6, a.radius * 0.6),
        vx: Math.cos(fa) * fs + a.vx, vy: Math.sin(fa) * fs + a.vy,
        life: this.rng.range(0.6, 1.4), maxLife: 1.4,
        size: this.rng.range(2, 5.5), color: this.rng.chance(0.5) ? col : '#7d8b96',
        type: 'frag', rot: this.rng.range(0, TAU), vr: this.rng.range(-6, 6), drag: 0.7
      });
    }
    this.particles.ring(a.x, a.y, a.radius * 0.5, a.radius * 2.1, 0.55, U.hexA(col, 0.55), 3);
    this.shake(2 + a.radius * 0.03);
    this.sfx('rockBreak', a.x, a.y, a.radius / 110);

    // ---- progression
    p.counters.asteroidsMined++;
    var xp = Math.round(4 + a.radius * 0.18 + res.hardness * 2.2);
    this.game.awardXp(xp);
    if (this.rng.chance(0.28)) this.notify('+' + total + ' ' + res.name.toUpperCase(), 'ore', 1.6);
  };

  /* =======================  PLAYER  ================================= */
  World.prototype.updatePlayer = function (dt, input) {
    var p = this.player;
    var s = this.stats;
    var profile = this.profile;

    p.invuln = Math.max(0, p.invuln - dt);
    p.hitFlash = Math.max(0, p.hitFlash - dt * 2.4);
    p.shieldFlash = Math.max(0, p.shieldFlash - dt * 2.2);
    p.shieldHitT = Math.max(0, p.shieldHitT - dt);
    p.weaponCd = Math.max(0, p.weaponCd - dt);
    p.cargoFullWarnCd = Math.max(0, p.cargoFullWarnCd - dt);

    if (p.dead) {
      p.deadT += dt;
      p.vx *= Math.pow(0.3, dt);
      p.vy *= Math.pow(0.3, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      return;
    }

    // ---- steering
    var ax = 0, ay = 0;
    if (input && !p.docked) {
      ax = input.ax || 0;
      ay = input.ay || 0;
    }
    var mag = Math.hypot(ax, ay);
    if (mag > 1) { ax /= mag; ay /= mag; mag = 1; }

    var boosting = input && input.boost && p.energy > 1 && mag > 0.1;
    var accel = s.accel * (boosting ? 1.85 : 1);
    p.vx += ax * accel * dt;
    p.vy += ay * accel * dt;

    if (boosting) {
      p.energy = Math.max(0, p.energy - 16 * dt);
      p.boost = U.clamp(p.boost + dt * 6, 0, 1);
      if (this.rng.chance(dt * 30)) {
        this.particles.add({
          x: p.x - Math.cos(p.angle) * 30, y: p.y - Math.sin(p.angle) * 30,
          vx: -Math.cos(p.angle) * 120 + this.rng.range(-30, 30),
          vy: -Math.sin(p.angle) * 120 + this.rng.range(-30, 30),
          life: 0.35, maxLife: 0.35, size: 2.4, color: '#9ff0ff', type: 'glow'
        });
      }
    } else {
      p.boost = Math.max(0, p.boost - dt * 3);
    }

    // drag (space has none, but gameplay needs it)
    var drag = Math.pow(1 / (1 + s.drag * 0.42), dt * 60 * 0.06 + dt);
    var damping = Math.pow(0.06, dt);
    p.vx *= damping; p.vy *= damping;

    var speed = Math.hypot(p.vx, p.vy);
    var maxSpeed = s.maxSpeed * (boosting ? 1.5 : 1);
    if (speed > maxSpeed) {
      p.vx = p.vx / speed * maxSpeed;
      p.vy = p.vy / speed * maxSpeed;
      speed = maxSpeed;
    }
    p.speed = speed;

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // world bounds with soft bounce
    var pad = 40;
    if (p.x < pad) { p.x = pad; p.vx = Math.abs(p.vx) * 0.35; }
    if (p.y < pad) { p.y = pad; p.vy = Math.abs(p.vy) * 0.35; }
    if (p.x > WORLD_W - pad) { p.x = WORLD_W - pad; p.vx = -Math.abs(p.vx) * 0.35; }
    if (p.y > WORLD_H - pad) { p.y = WORLD_H - pad; p.vy = -Math.abs(p.vy) * 0.35; }

    // ---- facing
    var aim = input && input.aimWorld;
    if (aim) {
      var want = Math.atan2(aim.y - p.y, aim.x - p.x);
      p.angle = U.angleLerp(p.angle, want, 1 - Math.pow(0.0000005, dt));
    } else if (speed > 30) {
      p.angle = U.angleLerp(p.angle, Math.atan2(p.vy, p.vx), 1 - Math.pow(0.001, dt));
    }

    // ---- energy & shields
    var regen = s.energyRegen;
    p.energy = Math.min(s.maxEnergy, p.energy + regen * dt);
    if (p.shieldHitT <= 0) {
      p.shield = Math.min(s.maxShield, p.shield + s.shieldRegen * dt);
    }
    if (s.hullRepair > 0) {
      p.hull = Math.min(s.maxHull, p.hull + s.hullRepair * dt);
    }

    // ---- mining beam
    p.beam = null;
    p.miningTarget = null;
    if (input && input.mine && !p.docked && p.energy > 1) {
      var aimPt = aim || { x: p.x + Math.cos(p.angle) * 300, y: p.y + Math.sin(p.angle) * 300 };
      var dx = aimPt.x - p.x, dy = aimPt.y - p.y;
      var dl = Math.hypot(dx, dy) || 1;
      dx /= dl; dy /= dl;
      var range = s.laserRange;
      var hit = this.raycastAsteroids(p.x + dx * 34, p.y + dy * 34, dx, dy, range);
      var fromX = p.x + dx * 30, fromY = p.y + dy * 30;
      var endX = p.x + dx * range, endY = p.y + dy * range;
      if (hit) {
        endX = hit.x; endY = hit.y;
        this.mineAsteroid(hit.asteroid, s.laserPower * dt, 'player');
        p.miningTarget = hit.asteroid;
        p.energy = Math.max(0, p.energy - 7.5 * s.energyCost * dt);
        p.beamHeat = Math.min(1, p.beamHeat + dt * 1.6);
        // face the rock while mining
        p.angle = U.angleLerp(p.angle, Math.atan2(dy, dx), 1 - Math.pow(0.00001, dt));
        // enemies take splash from the beam too
        for (var i = 0; i < this.enemies.length; i++) {
          var e = this.enemies[i];
          if (e.dead) continue;
          var perp = Math.abs((e.x - p.x) * dy - (e.y - p.y) * dx);
          var along = (e.x - p.x) * dx + (e.y - p.y) * dy;
          if (along > 0 && along < hit.dist && perp < e.radius) {
            this.damageEnemy(e, s.laserPower * 0.35 * dt, 'beam');
          }
        }
      } else {
        p.energy = Math.max(0, p.energy - 3.4 * s.energyCost * dt);
        p.beamHeat = Math.min(1, p.beamHeat + dt * 0.9);
        // beam can also burn enemies directly
        for (var k = 0; k < this.enemies.length; k++) {
          var en = this.enemies[k];
          if (en.dead) continue;
          var perp2 = Math.abs((en.x - p.x) * dy - (en.y - p.y) * dx);
          var along2 = (en.x - p.x) * dx + (en.y - p.y) * dy;
          if (along2 > 0 && along2 < range && perp2 < en.radius) {
            this.damageEnemy(en, s.laserPower * 0.4 * dt, 'beam');
          }
        }
      }
      p.beam = { x1: fromX, y1: fromY, x2: endX, y2: endY, heat: p.beamHeat, hit: !!hit };
      if (this.rng.chance(dt * 40) && hit) {
        this.particles.add({
          x: endX, y: endY, vx: this.rng.range(-90, 90), vy: this.rng.range(-90, 90),
          life: 0.3, maxLife: 0.3, size: 2, color: '#a8fff2', type: 'spark', drag: 2
        });
      }
      if (!this._beamLoop) { this.sfx('beamLoop', p.x, p.y); this._beamLoop = true; }
    } else {
      p.beamHeat = Math.max(0, p.beamHeat - dt * 1.4);
      this._beamLoop = false;
    }

    // ---- weapons
    if (input && (input.fire || input.click) && !p.docked && p.weaponCd <= 0 && p.energy > 4) {
      var aim2 = aim || { x: p.x + Math.cos(p.angle) * 300, y: p.y + Math.sin(p.angle) * 300 };
      var a2 = Math.atan2(aim2.y - p.y, aim2.x - p.x) + this.rng.range(-0.02, 0.02);
      var sp = s.weaponSpeed;
      this.projectiles.push(Ent.makeProjectile(this, {
        x: p.x + Math.cos(a2) * 34, y: p.y + Math.sin(a2) * 34,
        vx: Math.cos(a2) * sp + p.vx * 0.35,
        vy: Math.sin(a2) * sp + p.vy * 0.35,
        dmg: s.weaponDamage, team: 'player', type: 'player', life: 1.9
      }));
      p.weaponCd = s.weaponCooldown;
      p.energy = Math.max(0, p.energy - 4);
      this.sfx('shoot', p.x, p.y);
      this.particles.burst(p.x + Math.cos(a2) * 36, p.y + Math.sin(a2) * 36, 3,
        { color: '#9ff0ff', speed: 90, size: 1.6, life: 0.16, angle: a2, spread: 0.7 });
      this.shake(0.5);
    }

    // ---- engine trail
    p.engineGlow = U.clamp(p.engineGlow + (mag > 0.2 ? dt * 4 : -dt * 3), 0, 1);
    if (mag > 0.2 && this.rng.chance(dt * 55)) {
      var back = p.angle + Math.PI;
      this.particles.add({
        x: p.x + Math.cos(back) * 30 + this.rng.range(-6, 6),
        y: p.y + Math.sin(back) * 30 + this.rng.range(-6, 6),
        vx: Math.cos(back) * 70 + this.rng.range(-20, 20),
        vy: Math.sin(back) * 70 + this.rng.range(-20, 20),
        life: 0.32, maxLife: 0.32, size: 2.2, color: '#9ff0ff', type: 'glow'
      });
    }

    // ---- asteroid collision
    for (var ai = 0; ai < this.asteroids.length; ai++) {
      var as = this.asteroids[ai];
      var dd = U.dist(p.x, p.y, as.x, as.y);
      var minD = as.radius * 0.86 + 26;
      if (dd < minD && dd > 0.01) {
        var nx = (p.x - as.x) / dd, ny = (p.y - as.y) / dd;
        var overlap = minD - dd;
        p.x += nx * overlap; p.y += ny * overlap;
        var vn = p.vx * nx + p.vy * ny;
        if (vn < 0) {
          p.vx -= nx * vn * 1.5;
          p.vy -= ny * vn * 1.5;
          if (-vn > 180) {
            this.damagePlayer(-vn * 0.06, 'impact');
            this.particles.burst(p.x + nx * 24, p.y + ny * 24, 6, { color: '#cfe6f2', speed: 100, size: 2, life: 0.4 });
            this.shake(2);
          }
        }
      }
    }
  };

  World.prototype.damagePlayer = function (amount, source) {
    var p = this.player;
    var s = this.stats;
    if (p.dead || p.invuln > 0) return;
    var dmg = Math.max(0, amount) * (1 - (s.armor || 0));
    if (p.shield > 0) {
      var absorbed = Math.min(p.shield, dmg);
      p.shield -= absorbed;
      dmg -= absorbed;
      p.shieldFlash = 1;
      p.shieldHitT = 2.6;
      if (absorbed > 0) {
        this.particles.ring(p.x, p.y, 26, 52, 0.35, 'rgba(120,210,255,0.65)', 2.5);
        this.sfx('shieldHit', p.x, p.y);
      }
    }
    if (dmg > 0) {
      p.hull -= dmg;
      p.hitFlash = 1;
      p.invuln = 0.18;
      this.sfx('hullHit', p.x, p.y);
      this.particles.burst(p.x, p.y, 5, { color: '#ff6a6a', speed: 110, size: 2.2, life: 0.4 });
      if (source !== 'storm') this.shake(Math.min(9, 2 + dmg * 0.22));
    }
    if (p.hull <= 0) {
      p.hull = 0;
      this.killPlayer();
    }
  };

  World.prototype.killPlayer = function () {
    var p = this.player;
    if (p.dead) return;
    p.dead = true;
    p.deadT = 0;
    this.particles.burst(p.x, p.y, 42, { color: '#ffb257', speed: 300, size: 3.4, life: 1.2 });
    this.particles.burst(p.x, p.y, 22, { color: '#9ff0ff', speed: 220, size: 2.4, life: 0.9 });
    this.particles.ring(p.x, p.y, 20, 190, 1.1, 'rgba(255,178,87,0.7)', 5);
    this.shake(16);
    this.sfx('playerDeath', p.x, p.y);
    this.profile.counters.deaths++;
    this.game.onPlayerDeath();
  };

  World.prototype.respawn = function () {
    var p = this.player;
    var s = this.stats;
    p.dead = false;
    p.deadT = 0;
    p.x = this.station.x + 30;
    p.y = this.station.y + 210;
    p.vx = 0; p.vy = 0;
    p.hull = s.maxHull;
    p.shield = s.maxShield;
    p.energy = s.maxEnergy;
    p.invuln = 3;
    if (this.game && this.game.camera) {
      this.game.camera.x = p.x;
      this.game.camera.y = p.y;
    }
  };

  /* =======================  ENEMIES  ================================ */
  World.prototype.spawnEnemy = function (pos) {
    if (this.enemies.length >= this.sector.enemies.max) return null;
    var defs = this.sector.enemies.types;
    var pick = this.rng.weighted(defs, function (d) { return d[1]; });
    var type = pick ? pick[0] : 'scout';
    var pt = pos || this.randomSpawnPoint();
    var e = Ent.makeEnemy(this, type, pt.x, pt.y);
    this.enemies.push(e);
    // warp-in flash
    this.particles.ring(pt.x, pt.y, 10, 60, 0.5, U.hexA(e.def.art.color, 0.6), 2);
    return e;
  };

  World.prototype.damageEnemy = function (e, dmg, source, fromPlayer, hitX, hitY) {
    if (e.dead) return;
    var dealt = dmg;
    if (e.shield > 0) {
      var abs = Math.min(e.shield, dealt);
      e.shield -= abs;
      dealt -= abs;
      e.shieldFlash = 1;
    }
    e.hp -= dealt;
    e.hitFlash = 1;
    if (dealt > 0.6) {
      this.particles.text(hitX || e.x, (hitY || e.y) - e.radius * 0.6, Math.round(dealt),
        fromPlayer ? '#ffe9a8' : '#ffffff', fromPlayer ? 13 : 11);
    }
    if (dmg >= 4) this.sfx('enemyHit', e.x, e.y);
    if (e.hp <= 0) this.killEnemy(e);
  };

  World.prototype.killEnemy = function (e) {
    if (e.dead) return;
    e.dead = true;
    var idx = this.enemies.indexOf(e);
    if (idx >= 0) this.enemies.splice(idx, 1);
    var def = e.def;
    this.particles.burst(e.x, e.y, 30, { color: def.art.color, speed: 240, size: 3, life: 0.9 });
    this.particles.burst(e.x, e.y, 14, { color: '#ffd9a0', speed: 160, size: 2.4, life: 0.6 });
    for (var i = 0; i < 8; i++) {
      var a = this.rng.range(0, TAU), sp = this.rng.range(50, 220);
      this.particles.add({
        x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: this.rng.range(0.6, 1.2), maxLife: 1.2, size: this.rng.range(2, 4.5),
        color: this.rng.chance(0.6) ? def.art.color : '#5b6672',
        type: 'frag', rot: this.rng.range(0, TAU), vr: this.rng.range(-8, 8), drag: 0.8
      });
    }
    this.particles.ring(e.x, e.y, e.radius, e.radius * 4, 0.6, U.hexA(def.art.color, 0.5), 3);
    this.shake(4 + def.radius * 0.08);
    this.sfx('explode', e.x, e.y);

    var reward = Math.round(def.reward * (1 + this.sector.index * 0.08));
    this.profile.credits += reward;
    this.profile.counters.creditsEarned += reward;
    this.profile.counters.kills++;
    this.game.awardXp(def.xp);
    this.notify('+' + reward + ' CR  ·  ' + def.name + ' DESTROYED', 'good', 2);
    this.particles.text(e.x, e.y - 20, '+' + reward, '#ffd166', 14);

    // salvage drop
    if (this.rng.chance(0.55)) {
      var resId = this.pickResource();
      this.pickups.push(Ent.makePickup(this, e.x, e.y, resId, this.rng.int(1, 3),
        this.rng.range(-60, 60), this.rng.range(-60, 60)));
    }
    this.game.checkAchievementsNow();
  };

  /* =======================  PICKUPS  ================================= */
  World.prototype.updatePickups = function (dt) {
    var p = this.player;
    var s = this.stats;
    for (var i = this.pickups.length - 1; i >= 0; i--) {
      var pk = this.pickups[i];
      pk.life += dt;
      var target = null, collectR = 30;
      var dPlayer = U.dist(pk.x, pk.y, p.x, p.y);
      if (!p.dead && dPlayer < s.magnetRadius) target = p;
      if (!target) {
        var best = null, bd = 1e9;
        for (var d = 0; d < this.drones.length; d++) {
          var dr = this.drones[d];
          if (dr.cargoUsed >= SM.Ent.droneCapacity(this) * 0.95) continue;
          var dd = U.dist(pk.x, pk.y, dr.x, dr.y);
          if (dd < 260 && dd < bd) { bd = dd; best = dr; }
        }
        if (best) { target = best; collectR = 24; }
      }

      if (target) {
        var dx = target.x - pk.x, dy = target.y - pk.y;
        var dl = Math.hypot(dx, dy) || 1;
        var pull = 900 * s.collectSpeed / 330;
        pk.vx += (dx / dl) * pull * dt;
        pk.vy += (dy / dl) * pull * dt;
        var sp = Math.hypot(pk.vx, pk.vy);
        if (sp > 620) { pk.vx = pk.vx / sp * 620; pk.vy = pk.vy / sp * 620; }
        if (dl < collectR) {
          // collect
          if (target === p) {
            var added = SM.Profile.addResource(this.profile, pk.resId, pk.qty);
            if (added > 0) {
              this.sfx('pickup', pk.x, pk.y);
              this.particles.burst(pk.x, pk.y, 4, { color: SM.Resources.get(pk.resId).glow, speed: 70, size: 1.6, life: 0.3 });
              if (added < pk.qty) {
                pk.qty -= added;
                this.warnCargoFull();
                continue;
              }
              this.pickups.splice(i, 1);
              continue;
            } else {
              this.warnCargoFull();
            }
          } else {
            if (pk.qty <= 0) { this.pickups.splice(i, 1); continue; }
            // drone collection
            var res = SM.Resources.get(pk.resId);
            var capLeft = SM.Ent.droneCapacity(this) - target.cargoUsed;
            var can = Math.max(0, Math.floor(capLeft / res.mass));
            var take = Math.min(pk.qty, can);
            if (take > 0) {
              SM.Ent.addDroneCargo(this, target, pk.resId, take);
              pk.qty -= take;
              this.sfx('pickup', pk.x, pk.y, 0.5);
              this.particles.burst(pk.x, pk.y, 3, { color: res.glow, speed: 60, size: 1.4, life: 0.25 });
              if (pk.qty <= 0) { this.pickups.splice(i, 1); continue; }
            }
          }
        }
      }

      var dr2 = Math.pow(0.4, dt);
      pk.vx *= dr2; pk.vy *= dr2;
      pk.x += pk.vx * dt;
      pk.y += pk.vy * dt;
      pk.phase += dt * 3;
      if (pk.life > pk.maxLife) this.pickups.splice(i, 1);
    }
  };

  World.prototype.warnCargoFull = function () {
    var p = this.player;
    if (p.cargoFullWarnCd > 0) return;
    p.cargoFullWarnCd = 3;
    this.notify('CARGO HOLD FULL — DOCK TO SELL', 'warn', 3);
    this.sfx('alarm', p.x, p.y, 0.5);
  };

  /* =======================  COMBAT  ================================= */
  World.prototype.updateProjectiles = function (dt) {
    var p = this.player;
    for (var i = this.projectiles.length - 1; i >= 0; i--) {
      var pr = this.projectiles[i];
      pr.life -= dt;
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      if (pr.life <= 0 || pr.x < -50 || pr.y < -50 || pr.x > WORLD_W + 50 || pr.y > WORLD_H + 50) {
        this.projectiles.splice(i, 1);
        continue;
      }
      // asteroids stop shots
      var hitA = null;
      for (var a = 0; a < this.asteroids.length; a++) {
        var as = this.asteroids[a];
        if (U.dist2(pr.x, pr.y, as.x, as.y) < as.radius * as.radius * 0.85) { hitA = as; break; }
      }
      if (hitA) {
        this.particles.burst(pr.x, pr.y, 4, { color: pr.style.color, speed: 90, size: 1.8, life: 0.3 });
        if (pr.team === 'player') this.mineAsteroid(hitA, pr.dmg * 0.5, 'weapon');
        this.projectiles.splice(i, 1);
        continue;
      }

      if (pr.team === 'player') {
        var hitE = null;
        for (var e = 0; e < this.enemies.length; e++) {
          var en = this.enemies[e];
          if (en.dead) continue;
          if (U.dist2(pr.x, pr.y, en.x, en.y) < (en.radius + pr.r) * (en.radius + pr.r)) { hitE = en; break; }
        }
        if (hitE) {
          this.damageEnemy(hitE, pr.dmg, 'weapon', true, pr.x, pr.y);
          this.particles.burst(pr.x, pr.y, 6, { color: '#ffe9a8', speed: 120, size: 2, life: 0.3 });
          this.projectiles.splice(i, 1);
          continue;
        }
      } else if (!p.dead) {
        var rr = 20;
        if (U.dist2(pr.x, pr.y, p.x, p.y) < (rr + pr.r) * (rr + pr.r)) {
          this.damagePlayer(pr.dmg, 'projectile');
          this.particles.burst(pr.x, pr.y, 7, { color: pr.style.color, speed: 130, size: 2.2, life: 0.35 });
          this.projectiles.splice(i, 1);
          continue;
        }
      }
    }
  };

  World.prototype.updateEnemies = function (dt) {
    var p = this.player;
    for (var i = this.enemies.length - 1; i >= 0; i--) {
      var e = this.enemies[i];
      Ent.updateEnemy(this, e, dt);

      // contact damage
      if (!p.dead && U.dist(e.x, e.y, p.x, p.y) < e.radius + 22) {
        e.ramCd = (e.ramCd || 0) - dt;
        if (e.ramCd <= 0) {
          this.damagePlayer(e.def.damage * 0.7, 'ram');
          e.ramCd = 0.8;
          e.vx *= -0.5; e.vy *= -0.5;
          this.particles.burst((e.x + p.x) / 2, (e.y + p.y) / 2, 8, { color: '#ffb257', speed: 120, size: 2, life: 0.35 });
        }
      }

      // despawn far strays
      if (U.dist(e.x, e.y, p.x, p.y) > 2600) {
        this.enemies.splice(i, 1);
        continue;
      }
    }

    // spawn management
    this.enemySpawnT = (this.enemySpawnT || 0) + dt;
    var want = this.sector.enemies.max;
    if (this.enemies.length < want && this.enemySpawnT > this.sector.enemies.spawnEvery) {
      this.enemySpawnT = 0;
      if (!p.dead) {
        var e2 = this.spawnEnemy(this.randomSpawnPoint(900, 1500));
        if (e2) this.notify('HOSTILE SIGNATURE · ' + e2.def.short, 'warn', 2);
      }
    }
  };

  /* =======================  DRONES  ================================= */
  World.prototype.updateDrones = function (dt) {
    for (var i = 0; i < this.drones.length; i++) {
      Ent.updateDrone(this, this.drones[i], dt);
    }
  };

  World.prototype.findDroneTarget = function (x, y, maxDist) {
    var best = null, bd = maxDist * maxDist;
    for (var i = 0; i < this.asteroids.length; i++) {
      var a = this.asteroids[i];
      if (a.dead || a.reserved) continue;
      var d = U.dist2(x, y, a.x, a.y);
      if (d < bd) { bd = d; best = a; }
    }
    if (best) best.reserved = false;
    return best;
  };

  /* =======================  HAZARDS  ================================ */
  World.prototype.updateHazards = function (dt) {
    var h = this.sector.hazard;
    var p = this.player;

    if (h.kind === 'debris') {
      for (var i = this.debris.length - 1; i >= 0; i--) {
        var d = this.debris[i];
        d.x += d.vx * dt; d.y += d.vy * dt;
        d.rot += d.vr * dt;
        d.hitCd = Math.max(0, d.hitCd - dt);
        if (d.x < -80 || d.y < -80 || d.x > WORLD_W + 80 || d.y > WORLD_H + 80) {
          this.debris.splice(i, 1);
          this.spawnDebris();
          continue;
        }
        if (!p.dead && d.hitCd <= 0 && U.dist(d.x, d.y, p.x, p.y) < d.r + 20) {
          this.damagePlayer(d.dmg, 'impact');
          d.hitCd = 1;
          this.particles.burst(d.x, d.y, 8, { color: '#b0a89a', speed: 120, size: 2, life: 0.5 });
          d.vx *= -0.4; d.vy *= -0.4;
        }
        // debris can be shot for a little ore
        for (var k = this.projectiles.length - 1; k >= 0; k--) {
          var pr = this.projectiles[k];
          if (pr.team === 'player' && U.dist2(pr.x, pr.y, d.x, d.y) < d.r * d.r) {
            this.projectiles.splice(k, 1);
            this.particles.burst(d.x, d.y, 10, { color: '#cbbfa8', speed: 150, size: 2.2, life: 0.6 });
            this.debris.splice(i, 1);
            this.spawnDebris();
            if (this.rng.chance(0.35)) {
              this.pickups.push(Ent.makePickup(this, d.x, d.y, this.pickResource(), 1, this.rng.range(-70, 70), this.rng.range(-70, 70)));
            }
            break;
          }
        }
      }
    }

    if (h.kind === 'storm') {
      this.hazardTimer -= dt;
      if (this.hazardTimer <= 0 && !p.dead) {
        this.hazardTimer = this.rng.range(3.4, 6.2) / (0.7 + h.intensity * 0.4);
        var ang = this.rng.range(0, TAU);
        var dist = this.rng.range(120, 460);
        this.storms.push({
          x: p.x + Math.cos(ang) * dist,
          y: p.y + Math.sin(ang) * dist,
          t: 0, tele: 1.15, done: false, seed: this.rng.next() * 1000
        });
      }
      for (var s = this.storms.length - 1; s >= 0; s--) {
        var st = this.storms[s];
        st.t += dt;
        if (!st.done && st.t > st.tele) {
          st.done = true;
          st.strikeT = 0;
          this.particles.burst(st.x, st.y, 20, { color: '#bfa8ff', speed: 260, size: 2.6, life: 0.5 });
          this.particles.ring(st.x, st.y, 10, 110, 0.4, 'rgba(190,160,255,0.7)', 3);
          this.shake(6);
          this.sfx('thunder', st.x, st.y);
          if (!p.dead && U.dist(st.x, st.y, p.x, p.y) < 120) {
            this.damagePlayer(17 * h.intensity, 'storm');
          }
          for (var en = 0; en < this.enemies.length; en++) {
            if (U.dist(st.x, st.y, this.enemies[en].x, this.enemies[en].y) < 120) {
              this.damageEnemy(this.enemies[en], 26, 'storm', false);
            }
          }
        }
        if (st.done) st.strikeT += dt;
        if (st.t > st.tele + 0.55) this.storms.splice(s, 1);
      }
    }

    if (h.kind === 'gravity') {
      for (var w = 0; w < this.wells.length; w++) {
        var well = this.wells[w];
        well.phase += dt;
        var dx = well.x - p.x, dy = well.y - p.y;
        var d2 = Math.hypot(dx, dy) || 1;
        if (d2 < well.r) {
          var f = (1 - d2 / well.r) * well.strength;
          if (!p.dead) {
            p.vx += (dx / d2) * f * dt;
            p.vy += (dy / d2) * f * dt;
          }
          for (var ai = 0; ai < this.asteroids.length; ai++) {
            var as = this.asteroids[ai];
            var ax = well.x - as.x, ay = well.y - as.y;
            var ad = Math.hypot(ax, ay) || 1;
            if (ad < well.r) {
              var af = (1 - ad / well.r) * well.strength * 0.12;
              as.vx += (ax / ad) * af * dt;
              as.vy += (ay / ad) * af * dt;
            }
          }
        }
      }
      // draw occasional dust falling into wells
      if (this.rng.chance(dt * 6)) {
        var ws = this.wells[this.rng.int(0, this.wells.length - 1)];
        if (ws) {
          var a3 = this.rng.range(0, TAU), rr = this.rng.range(ws.r * 0.5, ws.r);
          this.particles.add({
            x: ws.x + Math.cos(a3) * rr, y: ws.y + Math.sin(a3) * rr,
            vx: -Math.cos(a3) * 40, vy: -Math.sin(a3) * 40,
            life: 1.4, maxLife: 1.4, size: 1.4, color: '#b07dff', type: 'glow', drag: 0
          });
        }
      }
    }

    if (h.kind === 'nebula') {
      if (this.rng.chance(dt * 3)) {
        this.particles.add({
          x: p.x + this.rng.range(-700, 700), y: p.y + this.rng.range(-500, 500),
          vx: this.rng.range(-8, 8), vy: this.rng.range(-8, 8),
          life: 4, maxLife: 4, size: this.rng.range(3, 9),
          color: this.sector.palette.nebula[this.rng.int(0, 2)], type: 'smoke', drag: 0.2, alpha: 0.25
        });
      }
    }
  };

  /* =======================  MAIN UPDATE  ============================ */
  World.prototype.update = function (dt, input) {
    dt = Math.min(dt, 0.05);
    if (this.paused) return;
    this.time += dt;
    this.profile.counters.playTime += dt;

    this.updatePlayer(dt, input);
    this.updateDrones(dt);
    this.updateEnemies(dt);
    this.updateProjectiles(dt);
    this.updatePickups(dt);
    this.updateHazards(dt);

    // asteroid drift + spin
    for (var i = 0; i < this.asteroids.length; i++) {
      var a = this.asteroids[i];
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.vr * dt;
      a.hitFlash = Math.max(0, a.hitFlash - dt * 2.4);
      a.glowPhase += dt;
      if (a.x < a.radius) { a.x = a.radius; a.vx = Math.abs(a.vx); }
      if (a.y < a.radius) { a.y = a.radius; a.vy = Math.abs(a.vy); }
      if (a.x > WORLD_W - a.radius) { a.x = WORLD_W - a.radius; a.vx = -Math.abs(a.vx); }
      if (a.y > WORLD_H - a.radius) { a.y = WORLD_H - a.radius; a.vy = -Math.abs(a.vy); }
    }

    this.station.phase += dt * 0.25;
    this.particles.update(dt);

    for (var t = this.toasts.length - 1; t >= 0; t--) {
      this.toasts[t].life -= dt;
      if (this.toasts[t].life <= 0) this.toasts.splice(t, 1);
    }

    // recharge / heat
    if (this.player.beam) this.player.beamHeat = this.player.beam.heat;
  };

  World.prototype.distanceToStation = function () {
    return U.dist(this.player.x, this.player.y, this.station.x, this.station.y);
  };

  World.prototype.canDock = function () {
    return !this.player.dead && this.distanceToStation() < this.station.r + 90;
  };

  World.prototype.getPickableTarget = function (x, y) {
    return this.asteroidAt(x, y, 12);
  };

  SM.World = World;
})(typeof window !== 'undefined' ? window : globalThis);

(function (root) {

  var SHIP_RENDER = {
    prospector: { k: 0.50, engines: [[-31, -13], [-31, 13]], nose: 46, width: 21 },
    harvester: { k: 0.50, engines: [[-47, -26], [-47, 0], [-47, 26]], nose: 52, width: 30 },
    interceptor: { k: 0.55, engines: [[-38, -8], [-38, 8]], nose: 56, width: 15 },
    leviathan: { k: 0.52, engines: [[-53, -32], [-53, -12], [-53, 12], [-53, 32]], nose: 64, width: 38 }
  };

  function Renderer(canvas) {
    this.canvas = canvas;
