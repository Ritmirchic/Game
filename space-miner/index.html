  }

  Renderer.prototype.resize = function (w, h, dpr) {
    this.w = w; this.h = h;
    this.dpr = dpr || 1;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.buildOverlay();
  };

  Renderer.prototype.buildOverlay = function () {
    var c = U.makeCanvas(this.w, this.h);
    var ctx = c.getContext('2d');
    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (var y = 0; y < this.h; y += 3) ctx.fillRect(0, y, this.w, 1);
    // vignette
    var g = ctx.createRadialGradient(this.w / 2, this.h / 2, Math.min(this.w, this.h) * 0.32,
      this.w / 2, this.h / 2, Math.max(this.w, this.h) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.72, 'rgba(0,0,0,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);
    this.overlay = c;
  };

  /* ------------------------------------------------------------------ */
  Renderer.prototype.worldToScreen = function (x, y, cam) {
    return { x: (x - cam.x) * cam.zoom + this.w / 2, y: (y - cam.y) * cam.zoom + this.h / 2 };
  };
  Renderer.prototype.screenToWorld = function (x, y, cam) {
    return { x: (x - this.w / 2) / cam.zoom + cam.x, y: (y - this.h / 2) / cam.zoom + cam.y };
  };

  /* ------------------------------------------------------------------ */
  Renderer.prototype.render = function (game, dt) {
    var ctx = this.ctx;
    var w = this.w, h = this.h;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#04060b';
    ctx.fillRect(0, 0, w, h);

    var world = game.world;
    if (!world) {
      this.renderIdleBackdrop(game, dt);
      return;
    }
    var cam = game.camera;

    this.drawBackdrop(ctx, world, cam, game);
    this.drawHazardBack(ctx, world, game);

    ctx.save();
    ctx.translate(w / 2 + cam.shakeX, h / 2 + cam.shakeY);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    this.drawStation(ctx, world, game);
    this.drawPickups(ctx, world, game);
    this.drawAsteroids(ctx, world, game);
    this.drawDebris(ctx, world, game);
    this.drawDrones(ctx, world, game);
    this.drawEnemies(ctx, world, game);
    this.drawPlayer(ctx, world, game);
    this.drawProjectiles(ctx, world, game);
    this.drawParticles(ctx, world, game);
    this.drawHazardFront(ctx, world, game);

    ctx.restore();

    this.drawScreenFX(ctx, world, game, dt);
  };

  Renderer.prototype.renderIdleBackdrop = function (game, dt) {
    var ctx = this.ctx, w = this.w, h = this.h;
    if (!this._idle) {
      this._idle = { stars: SM.Art.starLayer(9981, 260, 2000, { star: '#cfe8ff', accent: '#5fe6d8' }), t: 0 };
    }
    this._idle.t += dt;
    var g = ctx.createLinearGradient(0, 0, w * 0.3, h);
    g.addColorStop(0, '#050a14');
    g.addColorStop(0.5, '#0a1424');
    g.addColorStop(1, '#04060b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < this._idle.stars.length; i++) {
      var s = this._idle.stars[i];
      var tw = 0.55 + 0.45 * Math.sin(this._idle.t * s.tw + s.ph);
      ctx.fillStyle = hexA(s.c, s.a * tw);
      ctx.beginPath();
      ctx.arc((s.x + this._idle.t * 6) % 2000 * (w / 2000), (s.y % h), s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  /* ---------------- backdrop ---------------- */
  Renderer.prototype.drawBackdrop = function (ctx, world, cam, game) {
    var w = this.w, h = this.h;
    var bg = world.bg;
    if (bg) {
      var zoom = Math.max(w / bg.width, h / bg.height) * 1.22;
      var bw = bg.width * zoom, bh = bg.height * zoom;
      var px = U.clamp((cam.x / SM.Sectors.WORLD_W), 0, 1);
      var py = U.clamp((cam.y / SM.Sectors.WORLD_H), 0, 1);
      var ox = -(bw - w) * px + cam.parallaxX * 16;
      var oy = -(bh - h) * py + cam.parallaxY * 16;
      ctx.drawImage(bg, ox, oy, bw, bh);
    }

    // far stars (twinkle, slow parallax)
    var t = world.time;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var layers = [[world.stars1, 0.10, 2400], [world.stars2, 0.22, 2400]];
    for (var L = 0; L < layers.length; L++) {
      var arr = layers[L][0], par = layers[L][1], span = layers[L][2];
      for (var i = 0; i < arr.length; i++) {
        var s = arr[i];
        var sx = ((s.x - cam.x * par) % span + span) % span;
        var sy = ((s.y - cam.y * par) % span + span) % span;
        if (sx > w + 4 || sy > h + 4) continue;
        var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.tw + s.ph));
        ctx.fillStyle = hexA(s.c, s.a * tw * (L ? 0.9 : 0.65));
        ctx.beginPath();
        ctx.arc(sx, sy, s.r * (L ? 1.1 : 0.85), 0, TAU);
        ctx.fill();
      }
    }
    // dust motes drifting close to the camera
    var dust = world.dust;
    for (var d = 0; d < dust.length; d++) {
      var m = dust[d];
      var dx = ((m.x + m.vx * t - cam.x * 0.62) % 2400 + 2400) % 2400;
      var dy = ((m.y + m.vy * t - cam.y * 0.62) % 2400 + 2400) % 2400;
      if (dx > w || dy > h) continue;
      ctx.fillStyle = hexA(m.c, m.a * 0.7);
      ctx.beginPath();
      ctx.arc(dx, dy, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  /* ---------------- hazards behind entities ---------------- */
  Renderer.prototype.drawHazardBack = function (ctx, world, game) {
    if (world.sector.hazard.kind !== 'gravity') return;
    var cam = game.camera;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < world.wells.length; i++) {
      var wl = world.wells[i];
      var p = this.worldToScreen(wl.x, wl.y, cam);
      if (p.x < -800 || p.y < -800 || p.x > this.w + 800 || p.y > this.h + 800) continue;
      var r = wl.r * cam.zoom;
      var g = ctx.createRadialGradient(p.x, p.y, r * 0.12, p.x, p.y, r);
      g.addColorStop(0, 'rgba(10,4,26,0.55)');
      g.addColorStop(0.45, 'rgba(70,30,130,0.14)');
      g.addColorStop(0.85, 'rgba(140,80,255,0.06)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(176,125,255,0.14)';
      ctx.lineWidth = 1.5;
      for (var k = 1; k <= 3; k++) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * (0.28 + k * 0.2) + Math.sin(world.time * 0.8 + k) * 6, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  Renderer.prototype.drawHazardFront = function (ctx, world, game) {
    var hz = world.sector.hazard;
    if (hz.kind === 'storm') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < world.storms.length; i++) {
        var s = world.storms[i];
        if (s.done) {
          var a = 1 - s.strikeT / 0.55;
          if (a <= 0) continue;
          ctx.strokeStyle = 'rgba(200,180,255,' + (a * 0.9) + ')';
          ctx.lineWidth = 3 * a + 1;
          ctx.beginPath();
          var rng = new U.RNG(s.seed | 0);
          var x = s.x, y = s.y - 320;
          ctx.moveTo(x, y);
          for (var seg = 0; seg < 8; seg++) {
            x += rng.range(-24, 24);
            y += 40;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        } else {
          var t = s.t / s.tele;
          ctx.strokeStyle = 'rgba(190,160,255,' + (0.14 + t * 0.4) + ')';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(s.x, s.y, U.lerp(120, 26, t), 0, TAU);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(230,215,255,' + (0.1 + t * 0.24) + ')';
          ctx.beginPath();
          ctx.arc(s.x, s.y, U.lerp(140, 30, t) + Math.sin(world.time * 18) * 4, 0, TAU);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  };

  /* ---------------- station ---------------- */
  Renderer.prototype.drawStation = function (ctx, world, game) {
    var st = world.station;
    var art = SM.Art.station();
    var size = 400 * 0.66;
    var cam = game.camera;
    if (Math.abs(st.x - cam.x) > this.w / cam.zoom + 500 || Math.abs(st.y - cam.y) > this.h / cam.zoom + 500) return;

    // beacon glow
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pulse = 0.5 + 0.5 * Math.sin(world.time * 1.6);
    var g = ctx.createRadialGradient(st.x, st.y, 30, st.x, st.y, 260);
    g.addColorStop(0, 'rgba(255,190,120,' + (0.16 + pulse * 0.06) + ')');
    g.addColorStop(0.4, 'rgba(255,150,80,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(st.x, st.y, 260, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(st.x, st.y);
    ctx.rotate(st.phase * 0.35);
    ctx.globalAlpha = 0.98;
    ctx.drawImage(art.canvas, -size / 2, -size / 2, size, size);
    ctx.restore();

    // docking halo
    var near = world.distanceToStation() < world.station.r + 220;
    if (near) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(95,230,216,' + (0.25 + 0.2 * Math.sin(world.time * 4)) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r + 62, world.time * 0.6, world.time * 0.6 + TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  };

  /* ---------------- asteroids ---------------- */
  Renderer.prototype.drawAsteroids = function (ctx, world, game) {
    var cam = game.camera;
    var vw = this.w / cam.zoom, vh = this.h / cam.zoom;
    for (var i = 0; i < world.asteroids.length; i++) {
      var a = world.asteroids[i];
      if (a.x < cam.x - vw / 2 - 200 || a.x > cam.x + vw / 2 + 200) continue;
      if (a.y < cam.y - vh / 2 - 200 || a.y > cam.y + vh / 2 + 200) continue;
      var art = a.art;
      var s = a.radius / art.baseRadius;
      var dw = art.sprite.width * s, dh = art.sprite.height * s;
      var res = SM.Resources.get(a.resourceId);

      // subtle mineral glow behind the rock
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var glowA = 0.08 + 0.05 * Math.sin(a.glowPhase * 1.4) + a.damagePct * 0.16;
      var g = ctx.createRadialGradient(a.x, a.y, a.radius * 0.2, a.x, a.y, a.radius * 1.5);
      g.addColorStop(0, hexA(res.glow, glowA));
      g.addColorStop(1, hexA(res.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.radius * 1.5, 0, TAU); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.drawImage(art.sprite, -dw / 2, -dh / 2, dw, dh);

      // crack overlay as it takes damage
      if (a.damagePct > 0.02) {
        ctx.globalAlpha = Math.min(0.95, a.damagePct * 1.15);
        ctx.drawImage(art.cracks, -dw / 2, -dh / 2, dw, dh);
        ctx.globalAlpha = 1;
      }
      // hit flash
      if (a.hitFlash > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a.hitFlash * 0.5;
        ctx.drawImage(art.sprite, -dw / 2, -dh / 2, dw, dh);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      // richness sparkle
      if (a.rich || a.richness > 12) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var tw = 0.5 + 0.5 * Math.sin(world.time * 3 + a.id);
        ctx.fillStyle = hexA(res.glow, 0.35 * tw);
        ctx.beginPath();
        ctx.arc(a.x + Math.cos(a.id) * a.radius * 0.4, a.y + Math.sin(a.id * 1.7) * a.radius * 0.4, 2.2, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      // health ring when actively mined or damaged
      if (a.damagePct > 0.01 && (a === world.player.miningTarget || a.damagePct > 0.05)) {
        var pct = 1 - a.damagePct;
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius + 12, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = pct > 0.55 ? hexA(res.glow, 0.75) : pct > 0.25 ? '#ffd166' : '#ff6b6b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius + 12, -Math.PI / 2, -Math.PI / 2 + TAU * pct);
        ctx.stroke();
        ctx.restore();
      }

      // resource tag when the ship is close / scanning
      var dToShip = U.dist(a.x, a.y, world.player.x, world.player.y);
      if (dToShip < 260 && !world.player.dead) {
        ctx.save();
        ctx.globalAlpha = U.clamp(1 - (dToShip - 120) / 140, 0, 0.9);
        ctx.font = SM.Font.mono(9);
        ctx.fillStyle = hexA(res.color, 0.95);
        ctx.textAlign = 'center';
        ctx.fillText(res.code + ' · ' + a.richness, a.x, a.y + a.radius + 26);
        ctx.restore();
      }
    }
  };

  Renderer.prototype.drawDebris = function (ctx, world, game) {
    var d = world.debris;
    for (var i = 0; i < d.length; i++) {
      var o = d[i];
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.fillStyle = '#4c4a44';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (o.shape === 0) {
        ctx.moveTo(-o.r, -o.r * 0.5); ctx.lineTo(o.r * 0.3, -o.r); ctx.lineTo(o.r, o.r * 0.2);
        ctx.lineTo(o.r * 0.1, o.r); ctx.lineTo(-o.r * 0.8, o.r * 0.4);
      } else if (o.shape === 1) {
        ctx.rect(-o.r * 0.8, -o.r * 0.5, o.r * 1.6, o.r);
      } else {
        ctx.moveTo(-o.r, 0); ctx.lineTo(0, -o.r * 0.85); ctx.lineTo(o.r, 0); ctx.lineTo(0, o.r * 0.85);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,178,87,0.35)';
      ctx.fillRect(-o.r * 0.3, -o.r * 0.12, o.r * 0.6, o.r * 0.24);
      ctx.restore();
    }
  };

  /* ---------------- pickups ---------------- */
  Renderer.prototype.drawPickups = function (ctx, world, game) {
    for (var i = 0; i < world.pickups.length; i++) {
      var pk = world.pickups[i];
      var res = SM.Resources.get(pk.resId);
      var icon = SM.Icons.resource(res);
      var bob = Math.sin(pk.phase) * 2.2;
      var fade = pk.life > pk.maxLife - 6 ? U.clamp((pk.maxLife - pk.life) / 6, 0, 1) : 1;
      var size = 22 + pk.qty * 1.6;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(pk.x, pk.y + bob, 0, pk.x, pk.y + bob, size);
      g.addColorStop(0, hexA(res.glow, 0.35));
      g.addColorStop(1, hexA(res.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pk.x, pk.y + bob, size, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(icon.canvas, pk.x - size / 2, pk.y + bob - size / 2, size, size);
      ctx.restore();
    }
  };

  /* ---------------- player ---------------- */
  Renderer.prototype.drawPlayer = function (ctx, world, game) {
    var p = world.player;
    var ship = SM.Ships.get(world.profile.shipId);
    var art = SM.Art.ship(ship.id);
    var cfg = SHIP_RENDER[ship.id] || SHIP_RENDER.prospector;
    var k = cfg.k;

    if (p.dead) {
      return;
    }

    // engine plumes (behind hull)
    var thrust = p.speed / Math.max(1, world.stats.maxSpeed);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < cfg.engines.length; i++) {
      var ex = cfg.engines[i][0] * k, ey = cfg.engines[i][1] * k;
      var len = 8 + thrust * 34 + Math.sin(world.time * 24 + i * 2) * 3;
      var wdt = 3.4 + thrust * 2.6;
      var g = ctx.createLinearGradient(ex, ey, ex - len, ey);
      g.addColorStop(0, 'rgba(220,255,255,0.95)');
      g.addColorStop(0.28, 'rgba(120,235,255,0.75)');
      g.addColorStop(0.7, 'rgba(60,150,255,0.28)');
      g.addColorStop(1, 'rgba(40,80,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ex, ey - wdt);
      ctx.quadraticCurveTo(ex - len * 0.5, ey - wdt * 0.6, ex - len, ey);
      ctx.quadraticCurveTo(ex - len * 0.5, ey + wdt * 0.6, ex, ey + wdt);
      ctx.closePath();
      ctx.fill();
      var gl = ctx.createRadialGradient(ex, ey, 0, ex, ey, 12 + thrust * 8);
      gl.addColorStop(0, 'rgba(200,245,255,0.6)');
      gl.addColorStop(1, 'rgba(90,200,255,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(ex, ey, 12 + thrust * 8, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // hull
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    var dw = art.w * k, dh = art.h * k;
    ctx.drawImage(art.canvas, -dw / 2, -dh / 2, dw, dh);
    if (p.hitFlash > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = p.hitFlash * 0.55;
      ctx.drawImage(art.canvas, -dw / 2, -dh / 2, dw, dh);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();

    // mining beam
    if (p.beam) {
      var b = p.beam;
      var flicker = 0.7 + 0.3 * Math.sin(world.time * 55);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      // outer bloom
      ctx.strokeStyle = 'rgba(95,230,216,0.16)';
      ctx.lineWidth = 13;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      // mid
      var lg = ctx.createLinearGradient(b.x1, b.y1, b.x2, b.y2);
      lg.addColorStop(0, 'rgba(150,255,245,' + (0.55 * flicker) + ')');
      lg.addColorStop(0.5, 'rgba(95,230,216,' + (0.8 * flicker) + ')');
      lg.addColorStop(1, 'rgba(230,255,255,' + (0.95 * flicker) + ')');
      ctx.strokeStyle = lg;
      ctx.lineWidth = 3.2 + Math.sin(world.time * 40) * 0.8;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      // core
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * flicker) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();

      // impact flare
      if (b.hit) {
        var ig = ctx.createRadialGradient(b.x2, b.y2, 0, b.x2, b.y2, 26);
        ig.addColorStop(0, 'rgba(255,255,255,0.95)');
        ig.addColorStop(0.25, 'rgba(150,255,245,0.6)');
        ig.addColorStop(1, 'rgba(95,230,216,0)');
        ctx.fillStyle = ig;
        ctx.beginPath(); ctx.arc(b.x2, b.y2, 26, 0, TAU); ctx.fill();
        for (var s = 0; s < 4; s++) {
          var ang = world.time * 9 + s * 1.57;
          ctx.fillStyle = 'rgba(220,255,255,0.9)';
          ctx.beginPath();
          ctx.arc(b.x2 + Math.cos(ang) * (8 + s * 3), b.y2 + Math.sin(ang) * (8 + s * 3), 1.4, 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // shield bubble
    var spct = world.stats.maxShield > 0 ? p.shield / world.stats.maxShield : 0;
    if (spct > 0.02 || p.shieldFlash > 0.01) {
      ctx.save();
      ctx.translate(p.x, p.y);
      var rr = 42 + Math.sin(world.time * 2) * 1.5;
      ctx.globalCompositeOperation = 'lighter';
      var sg = ctx.createRadialGradient(0, 0, rr * 0.55, 0, 0, rr);
      sg.addColorStop(0, 'rgba(90,190,255,0)');
      sg.addColorStop(0.75, 'rgba(90,190,255,' + (0.05 + spct * 0.06 + p.shieldFlash * 0.25) + ')');
      sg.addColorStop(1, 'rgba(160,230,255,' + (0.10 + spct * 0.12 + p.shieldFlash * 0.4) + ')');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.fill();
      // hex facets

        aim = this.renderer.screenToWorld(input.mouse.x, input.mouse.y, cam);
      }
      input.aimWorld = aim;

      if (this.state === 'flight' && !input.touchMode) {
        // mining / weapons only while flying
        if (input.wasPressed('KeyE') && world && world.canDock()) this.dock();
      }

      if (world) {
        var flying = this.state === 'flight';
        var fl = flying ? input : { ax: 0, ay: 0, mine: false, fire: false, boost: false, aimWorld: aim };
        if (this.state === 'dead') fl = { ax: 0, ay: 0, mine: false, fire: false, boost: false, aimWorld: aim };
        world.update(dt, fl);
        this.updateCamera(dt);
        if (world.player.dead && this.state === 'flight') {
          this.state = 'dead';
          this.deathT = 0;
        }
        if (this.state === 'dead') this.deathT += dt;

        // contextual hints
        this.updateHints(dt);

        // audio
        if (this.audio) {
          var throttle = flying ? Math.min(1, Math.hypot(world.player.vx, world.player.vy) / Math.max(1, world.stats.maxSpeed)) : 0;
          this.audio.update(dt, dt, throttle, !!(world.player.beam), world.player.beamHeat);
        }

        // autosave
        this.autosaveT += dt;
        if (this.profile && this.autosaveT > 30 && this.state !== 'dead') {
          this.autosaveT = 0;
          this.save();
        }
      }
    }

    for (var i = this.toasts.length - 1; i >= 0; i--) {
      this.toasts[i].life -= dt;
      if (this.toasts[i].life <= 0) this.toasts.splice(i, 1);
    }
  };

  Game.prototype.updateHints = function () {
    var w = this.world, p = w.player, pr = this.profile;
    if (!pr.settings.showHints) return;
    function once(key) { if (pr.seen[key]) return false; pr.seen[key] = 1; return true; }

    if (this.state === 'flight') {
      if (!p.dead && w.time > 1.5 && once('fly')) {
        this.toast('WASD / ARROWS — FLY     ·     MOUSE — AIM', 'tip', 5);
      }
      var nearRock = false;
      for (var i = 0; i < w.asteroids.length; i++) {
        if (U.dist(p.x, p.y, w.asteroids[i].x, w.asteroids[i].y) < 420) { nearRock = true; break; }
      }
      if (nearRock && w.time > 3 && once('mine')) {
        this.toast('HOLD LEFT MOUSE TO FIRE THE MINING BEAM', 'tip', 5);
      }
      if (pr.counters.asteroidsMined >= 2 && once('collect')) {
        this.toast('ORE IS PULLED IN AUTOMATICALLY — WATCH YOUR CARGO', 'tip', 5);
      }
      if (w.canDock() && once('dock')) {
        this.toast('PRESS E TO DOCK AT ' + w.station.name, 'tip', 6);
      }
      if (SM.Profile.cargoUsed(pr) / Math.max(1, SM.Profile.cargoCap(pr)) > 0.6 && once('cargofull')) {
        this.toast('CARGO FILLING UP — DOCK AND SELL ORE', 'warn', 5);
      }
      if (p.beam && once('beam')) {
        this.toast('MINING DRAINS ENERGY — LET IT RECHARGE OR UPGRADE THE REACTOR', 'tip', 5);
      }
      if (w.time > 25 && once('map')) {
        this.toast('PRESS M FOR THE SECTOR CHART', 'tip', 5);
      }
      if (pr.counters.asteroidsMined >= 6 && once('upgrade')) {
        this.toast('DOCK, SELL ORE AND BUY UPGRADES TO REACH NEW SECTORS', 'tip', 6);
      }
      if (pr.counters.kills > 0 && once('combat')) {
        this.toast('SPACE / RIGHT MOUSE — FIRE CANNONS', 'tip', 4);
      }
    }
  };

  Game.prototype.onEscape = function () {
    if (this.state === 'flight') { this.prevState = 'flight'; this.state = 'paused'; this.sfxUI('uiClick'); }
    else if (this.state === 'paused') { this.state = 'flight'; this.sfxUI('uiClick'); }
    else if (this.state === 'map' || this.state === 'station') { this.state = 'flight'; this.sfxUI('uiClick'); if (this.world) this.world.paused = false; }
    else if (this.state === 'settings') { this.state = this.settingsReturn; }
    else if (this.state === 'achievements') { this.state = this.settingsReturn; }
    else if (this.state === 'menu') { /* no-op */ }
    else if (this.state === 'dead') { this.state = 'flight'; }
  };

  /* ---------------- progression ---------------- */
  Game.prototype.awardXp = function (amt) {
    if (!this.profile) return;
    var lvl = SM.Profile.addXp(this.profile, amt);
    if (lvl) {
      SM.Profile.invalidateStats();
      if (this.world) this.world.stats = SM.Profile.stats(this.profile);
      this.toast('PILOT LEVEL ' + lvl + ' — ALL SYSTEMS IMPROVED', 'level', 4);
      this.sfxUI('levelUp');
      this.refreshDrones();
    }
    this.checkAchievementsNow();
  };

  Game.prototype.checkAchievementsNow = function () {
    if (!this.profile) return;
    var unlocked = SM.Profile.checkAchievements(this.profile);
    for (var i = 0; i < unlocked.length; i++) {
      this.toast('ACHIEVEMENT · ' + unlocked[i].name + '  (+' + unlocked[i].reward + ' CR)', 'achievement', 5);
      this.sfxUI('achievement');
    }
    return unlocked;
  };

  Game.prototype.refreshDrones = function () {
    if (!this.world) return;
    this.world.stats = SM.Profile.stats(this.profile);
    SM.Profile.syncDrones(this.profile);
    if (this.world.drones.length !== this.world.stats.droneSlots) {
      this.world.rebuildDrones();
    }
  };

  Game.prototype.sfxUI = function (name) {
    if (this.audio) this.audio.play(name);
  };

  Game.prototype.toast = function (text, kind, ttl) {
    this.toasts.push({ text: text, kind: kind || 'info', life: ttl || 3.4, maxLife: ttl || 3.4, born: this.time });
    if (this.toasts.length > 4) this.toasts.shift();
  };

  Game.prototype.onPlayerDeath = function () {
    this.state = 'dead';
    this.deathT = 0;
    this.checkAchievementsNow();
  };

  Game.prototype.respawn = function () {
    var pr = this.profile;
    // insurance: lose 35% of cargo and 8% of credits (minimum 0)
    var lostUnits = 0;
    for (var id in pr.cargo) {
      var q = pr.cargo[id] | 0;
      var keep = Math.floor(q * 0.65);
      lostUnits += q - keep;
      if (keep > 0) pr.cargo[id] = keep; else delete pr.cargo[id];
    }
    var fee = Math.floor(pr.credits * 0.08);
    pr.credits -= fee;
    if (pr.credits < 0) pr.credits = 0;
    if (this.world) this.world.respawn();
    this.state = 'flight';
    this.toast('RECOVERED AT STATION · -' + fee + ' CR INSURANCE' + (lostUnits ? ' · ' + lostUnits + ' UNITS LOST' : ''), 'warn', 5);
    this.save();
  };

  Game.prototype.dock = function () {
    if (!this.world) return;
    if (!this.world.canDock()) { this.toast('TOO FAR FROM THE STATION', 'warn'); return; }
    this.world.paused = true;
    this.world.player.vx = 0;
    this.world.player.vy = 0;
    this.world.player.docked = true;
    this.state = 'station';
    this.sfxUI('dock');
    if (SM.UI) SM.UI.openStation();
  };

  Game.prototype.undock = function () {
    if (!this.world) return;
    this.world.paused = false;
    this.world.player.docked = false;
    var w = this.world;
    w.player.x = w.station.x + 30;
    w.player.y = w.station.y + 190;
    w.player.vx = 0; w.player.vy = 0;
    w.player.invuln = 1.5;
    this.state = 'flight';
    this.save();
    this.sfxUI('uiClick');
  };

  Game.prototype.travelTo = function (sectorId) {
    if (!this.profile) return;
    if (this.profile.sectors.indexOf(sectorId) < 0) return;
    this.profile.sector = sectorId;
    this.enterSector(sectorId);
    this.state = 'flight';
    this.world.player.docked = false;
    this.toast('JUMP COMPLETE — ' + SM.Sectors.get(sectorId).name, 'info', 4);
    this.save();
  };

  Game.prototype.save = function () {
    if (!this.profile) return;
    var res = SM.Profile.save(this.profile);
    if (!res.ok) this.toast('SAVE FAILED: ' + (res.error || 'unknown'), 'warn', 4);
    return res;
  };

  Game.prototype.loadSettingsFromProfile = function () {
    this.applySettings();
  };

  Game.prototype.quitToMenu = function () {
    this.save();
    this.state = 'menu';
    this.world = null;
    this.menuT = 0;
    if (SM.UI && SM.UI.reset) SM.UI.reset();
    this.audio.setBeam(false, 0);
    this.audio.setEngine(0, 0);
  };

  /* ---------------- draw ---------------- */
  Game.prototype.draw = function (dt) {
    var ctx = this.renderer.ctx;
    if (this.world && (this.state === 'flight' || this.state === 'station' || this.state === 'map' ||
      this.state === 'paused' || this.state === 'dead' || this.state === 'settings' || this.state === 'achievements')) {
      this.renderer.render(this, dt);
    } else {
      this.renderer.render(this, dt);
    }
    if (SM.UI) SM.UI.draw(this, ctx, dt);
  };

  Game.prototype.startLoop = function () {
    var self = this;
    var loop = function (ts) { self.frame(ts); if (!self.headless) root.requestAnimationFrame(loop); };
    this._loop = loop;
    if (!this.headless) root.requestAnimationFrame(loop);
  };

  /* step the simulation without a renderer (tests / benchmarks) */
  Game.prototype.stepHeadless = function (dt) {
    this.dt = dt;
    this.time += dt;
    this.update(dt);
  };

  SM.Game = Game;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ---- ui/widgets.js ---- */
/* =========================================================================

(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});

  var hexA = U.hexA;

  function inside(m, x, y, w, h) {
    return m.x >= x && m.x <= x + w && m.y >= y && m.y <= y + h;
  }

  /* ---------------- panels ---------------- */
  function panel(ctx, x, y, w, h, opt) {
    opt = opt || {};
    var cut = opt.cut === undefined ? 16 : opt.cut;
    ctx.save();
    // drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 8;
    Path.cutRect(ctx, x, y, w, h, cut);
    ctx.fillStyle = opt.fill || Theme.panel;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // inner gradient sheen
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, 'rgba(255,255,255,0.055)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.012)');
    g.addColorStop(1, 'rgba(0,0,0,0.18)');

    ctx.fillStyle = g;
    ctx.fill();

    Path.cutRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, cut);

    ctx.lineWidth = 1;

    ctx.moveTo(x + w - 2, y + h - cut); ctx.lineTo(x + w - 2, y + h - cut - L);
    ctx.moveTo(x + w - cut, y + h - 2); ctx.lineTo(x + w - cut - L, y + h - 2);
    ctx.stroke();
    ctx.restore();

  function header(ctx, x, y, w, title, opt) {
    opt = opt || {};

      font: Font.title(opt.size || 15, 700), color: opt.color || Theme.ink, spacing: 2.2
    });

      ctx.restore();
      Text.draw(ctx, opt.sub, x + w, y + (opt.h || 18) - 4, {

      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y + (opt.h || 18) + 6);
      ctx.lineTo(x + w, y + (opt.h || 18) + 6);
      ctx.stroke();
    }
    ctx.restore();
    return (opt.h || 18) + 6;
  }

  /* ---------------- buttons ---------------- */
  function button(ui, ctx, id, x, y, w, h, label, opt) {
    opt = opt || {};
    var hover = inside(ui.mouse, x, y, w, h) && !opt.disabled;
    var clicked = false;

      clicked = true;
    }

      ui.hoverId = id;
      if (ui.lastHover !== id) { ui.lastHover = id; ui.play('uiHover'); }
    }

    var active = opt.active;

    ctx.save();
    ctx.globalAlpha = opt.disabled ? 0.4 : 1;
    var fill;
    if (opt.primary) {
      fill = ctx.createLinearGradient(x, y, x, y + h);
      fill.addColorStop(0, hover ? hexA(accent, 0.30) : hexA(accent, 0.16));
      fill.addColorStop(1, hover ? hexA(accent, 0.14) : hexA(accent, 0.05));
    } else {
      fill = ctx.createLinearGradient(x, y, x, y + h);
      fill.addColorStop(0, hover ? 'rgba(120,180,220,0.20)' : (active ? 'rgba(95,230,216,0.12)' : 'rgba(120,180,220,0.06)'));
      fill.addColorStop(1, hover ? 'rgba(120,180,220,0.06)' : 'rgba(0,0,0,0.10)');
    }
    Path.cutRect(ctx, x, y, w, h, Math.min(10, h / 2.6));
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = hover ? hexA(accent, 0.85) : (opt.active ? hexA(accent, 0.55) : 'rgba(90,130,160,0.4)');
    ctx.lineWidth = hover ? 1.4 : 1;
    ctx.stroke();

    if (hover) {
      ctx.shadowColor = hexA(accent, 0.7);
      ctx.shadowBlur = 14;
      Path.cutRect(ctx, x, y, w, h, Math.min(10, h / 2.6));
      ctx.strokeStyle = hexA(accent, 0.9);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (opt.leftIcon) {
      ctx.save();
      ctx.strokeStyle = hover ? accent : Theme.inkSoft;
      ctx.fillStyle = 'transparent';
      ctx.lineWidth = 1.5;
      ctx.restore();
      SM.Icons.hud(ctx, opt.leftIcon, x + 20, y + h / 2, 16, hover ? accent : Theme.inkSoft);
    }
    Text.draw(ctx, label, x + w / 2 + (opt.leftIcon ? 8 : 0), y + h / 2 + (opt.sub ? 0 : 5), {
      font: Font.title(opt.size || 13, 700), color: opt.disabled ? Theme.dimmer : (hover ? '#ffffff' : (opt.color || Theme.ink)),
      align: 'center', spacing: opt.spacing === undefined ? 1.6 : opt.spacing
    });
    if (opt.sub) {
      Text.draw(ctx, opt.sub, x + w / 2, y + h - 7, {
        font: Font.mono(9), color: hover ? hexA(accent, 0.9) : Theme.dim, align: 'center', spacing: 0.8
      });
    }
    ctx.restore();
    if (clicked && !opt.disabled) ui.play(opt.sound || 'uiClick');
    return clicked;
  }

  /* ---------------- bars ---------------- */
  function bar(ctx, x, y, w, h, pct, color, opt) {
    opt = opt || {};
    pct = U.clamp(pct, 0, 1);
    ctx.save();
    ctx.fillStyle = opt.bg || 'rgba(255,255,255,0.07)';
    Path.cutRect(ctx, x, y, w, h, opt.cut === undefined ? 3 : opt.cut);
    ctx.fill();
    if (pct > 0.001) {
      var g = ctx.createLinearGradient(x, y, x + w, y);
      g.addColorStop(0, U.shade(color, -0.25));
      g.addColorStop(0.55, color);
      g.addColorStop(1, U.shade(color, 0.35));
      Path.cutRect(ctx, x, y, Math.max(2, w * pct), h, opt.cut === undefined ? 3 : opt.cut);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x + 1, y + 1, Math.max(0, w * pct - 2), Math.max(1, h * 0.3));

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(x + w * U.clamp(opt.marker, 0, 1), y, 1, h);
    }
    ctx.restore();
  }

  /* ---------------- misc ---------------- */
  function tag(ctx, x, y, text, color, opt) {
    opt = opt || {};
    ctx.save();
    ctx.font = Font.mono(opt.size || 9, 600);
    var w = Text.measure(ctx, text, Font.mono(opt.size || 9, 600), 1) + 12;
    var h = opt.h || 16;
    Path.cutRect(ctx, x, y, w, h, 3);
    ctx.fillStyle = hexA(color, 0.13);
    ctx.fill();
    ctx.strokeStyle = hexA(color, 0.5);
    ctx.lineWidth = 1;
    ctx.stroke();
    Text.draw(ctx, text, x + w / 2, y + h / 2 + 3.5, {
      font: Font.mono(opt.size || 9, 600), color: color, align: 'center', spacing: 0.8
    });
    ctx.restore();
    return w;
  }

  function keycap(ctx, x, y, label) {
    ctx.save();
    ctx.font = Font.mono(10, 700);
    var w = Math.max(18, Text.measure(ctx, label, Font.mono(10, 700)) + 10);
    Path.roundRect(ctx, x, y, w, 18, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,190,215,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    Text.draw(ctx, label, x + w / 2, y + 12.5, { font: Font.mono(10, 700), color: Theme.inkSoft, align: 'center' });
    ctx.restore();
    return w;
  }

  function divider(ctx, x, y, w, color) {
    ctx.save();
    var g = ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, color || 'rgba(120,170,200,0.45)');
    g.addColorStop(1, 'rgba(120,170,200,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, 1);
    ctx.restore();
  }

  function scrollArea(ui, ctx, key, x, y, w, h, contentH, drawFn) {
    var st = ui.scroll[key] || (ui.scroll[key] = { y: 0, target: 0 });
    var maxScroll = Math.max(0, contentH - h);
    var hover = inside(ui.mouse, x, y, w, h);
    if (hover && ui.wheel) {
      st.target = U.clamp(st.target + ui.wheel * 0.8, 0, maxScroll);
      ui.wheel = 0;

    st.target = U.clamp(st.target, 0, maxScroll);

    ctx.beginPath();
    ctx.rect(x, y, w, h);

    ctx.translate(0, -st.y);

    ctx.restore();

      var trackH = h;
      var thumbH = Math.max(26, trackH * (h / contentH));
      var thumbY = y + (trackH - thumbH) * (st.y / maxScroll);

      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(x + w + 6, y, 3, trackH);
      ctx.fillStyle = hexA(Theme.cyan, hover ? 0.7 : 0.4);
      ctx.fillRect(x + w + 6, thumbY, 3, thumbH);
      ctx.restore();
    }
    return st;
  }

  function slider(ui, ctx, id, x, y, w, label, value, opts) {
    opts = opts || {};
    var h = 22;
    var hover = inside(ui.mouse, x, y - 8, w, h + 8);
    var knobX = x + U.clamp(value, 0, 1) * w;
    ctx.save();
    Text.draw(ctx, label, x, y - 10, { font: Font.mono(10), color: Theme.dim, spacing: 1 });
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y + 4, w, 3);
    ctx.fillStyle = hexA(Theme.cyan, 0.7);
    ctx.fillRect(x, y + 4, U.clamp(value, 0, 1) * w, 3);

    ctx.fillStyle = hover ? '#ffffff' : Theme.cyan;
    ctx.fill();
    ctx.restore();

      var v = U.clamp((ui.mouse.x - x) / w, 0, 1);
      if (opts.steps) v = Math.round(v * opts.steps) / opts.steps;
      return { value: v, active: true };
    }
    return { value: value, active: false };
  }

  function checkbox(ui, ctx, id, x, y, label, value) {
    var hover = inside(ui.mouse, x, y - 14, 220, 26);
    var clicked = false;
    if (hover && ui.click) { ui.consume(); clicked = true; ui.play('uiClick'); }
    ctx.save();
    var s = 15;
    Path.cutRect(ctx, x, y - 11, s, s, 3);
    ctx.fillStyle = value ? hexA(Theme.cyan, 0.22) : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = hover ? Theme.cyan : 'rgba(140,180,210,0.45)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

      ctx.strokeStyle = Theme.cyan;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 4, y - 3.5);
      ctx.lineTo(x + 6.5, y - 0.5);
      ctx.lineTo(x + 11.5, y - 7.5);
      ctx.stroke();
    }
    Text.draw(ctx, label, x + s + 10, y, {
      font: Font.body(13), color: hover ? '#fff' : Theme.inkSoft, spacing: 0.6
    });

  }

  function cornerTicks(ctx, x, y, w, h, color, len) {
    len = len || 10;

    ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
    ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);

  /* ---------------- radar (bottom left) ---------------- */
  function drawRadar(ctx, game, ui, world, pal) {
    var s = ui.s;

    ctx.fillStyle = 'rgba(4,10,16,0.82)';

    }

    ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
    ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);

    function blip(wx, wy, col, r, glow) {

      if (glow) {
        ctx.globalCompositeOperation = 'lighter';
        var gg = ctx.createRadialGradient(cx + dx, cy + dy, 0, cx + dx, cy + dy, r * 3);

        ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r * 3, 0, 6.2832); ctx.fill();

      ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, 6.2832); ctx.fill();
    }

    for (var i = 0; i < world.asteroids.length; i++) {
      var a = world.asteroids[i];
      var res = SM.Resources.get(a.resourceId);
      if (res.tier >= 7) {
        blip(a.x, a.y, hexA(res.glow, 0.95), 2.6 * s, true);
      } else if (i % 2 === 0) {
        blip(a.x, a.y, hexA(res.color, 0.30), 1.2 * s, false);
      }
    }
    for (var d = 0; d < world.drones.length; d++) {
      blip(world.drones[d].x, world.drones[d].y, '#5fe6d8', 2.2 * s, true);

    });

      font: Font.mono(8.5 * s, 600), color: hexA(pal.accent, 0.8), align: 'right', spacing: 1.4
    });
  }

  /* ---------------- objective strip ---------------- */
  function nextObjective(game) {
    var pr = game.profile;
    var sectors = SM.Sectors.list;
    for (var i = 0; i < sectors.length; i++) {
      if (pr.sectors.indexOf(sectors[i].id) < 0) {
        var sec = sectors[i];
        var parts = [];
        if (sec.unlock.credits > 0) parts.push(U.fmtNum(sec.unlock.credits) + ' CR');
        for (var rid in sec.unlock.deliver) {
          parts.push(sec.unlock.deliver[rid] + ' ' + (SM.Resources.get(rid) || { code: rid }).code);
        }
        return {
          title: 'NEXT: UNLOCK ' + sec.name,
          detail: parts.join('  +  '),
          pct: U.clamp(pr.credits / Math.max(1, sec.unlock.credits), 0, 1)
        };
      }
    }
    return { title: 'FRONTIER MASTERED', detail: 'MAXIMISE YOUR FLEET AND UPGRADES', pct: 1 };
  }

  function drawObjective(ctx, game, ui, world, pal) {
    var s = ui.s;
    var obj = nextObjective(game);
    var w = 360 * s, h = 46 * s;
    var x = ui.w / 2 - w / 2, y = 24 * s;
    ctx.save();
    ctx.globalAlpha = 0.92;
    W.panel(ctx, x, y, w, h, { fill: 'rgba(5,12,20,0.7)', accent: hexA(pal.accent, 0.5), cut: 10 * s });
    Text.draw(ctx, obj.title, x + w / 2, y + 19 * s, {
      font: Font.title(10.5 * s, 700), color: pal.accent, align: 'center', spacing: 2
    });
    Text.draw(ctx, obj.detail, x + w / 2, y + 34 * s, {
      font: Font.mono(9 * s), color: Theme.inkSoft, align: 'center', spacing: 1
    });
    ctx.restore();
  }

  /* ---------------- toasts ---------------- */
  function drawToasts(ctx, game, ui) {
    var s = ui.s;
    var list = [];
    for (var i = 0; i < game.toasts.length; i++) list.push({ t: game.toasts[i] });
    if (game.world && game.world.toasts.length) {
      for (var j = 0; j < game.world.toasts.length; j++) list.push({ t: game.world.toasts[j] });
    }
    list = list.slice(-5);

    var y = ui.h - 150 * s;
    for (var k = list.length - 1; k >= 0; k--) {
      var entry = list[k];
      var t = entry.t;
      var a = U.clamp(t.life / Math.min(1, t.maxLife) * 1.4, 0, 1);
      if (t.life > t.maxLife - 0.25) a = (t.maxLife - t.life) / 0.25;
      var kindCol = t.kind === 'warn' ? '#ff6b6b' : t.kind === 'good' ? '#7fe0a8' :
        t.kind === 'level' ? '#ffd166' : t.kind === 'achievement' ? '#ffd166' :
          t.kind === 'ore' ? '#9ff0ff' : t.kind === 'tip' ? '#8ec6ff' : '#a8c4d6';
      ctx.save();
      ctx.globalAlpha = U.clamp(a, 0, 1);
      ctx.font = Font.mono(10.5 * s, 600);
      var tw = Math.min(ui.w * 0.6, Text.measure(ctx, t.text, Font.mono(10.5 * s, 600), 0.6) + 30 * s);
      var tx = ui.w / 2 - tw / 2;
      Path.cutRect(ctx, tx, y - 13 * s, tw, 24 * s, 5 * s);
      ctx.fillStyle = 'rgba(4,10,16,0.72)';

      ctx.strokeStyle = hexA(kindCol, 0.35);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = hexA(kindCol, 0.9);
      ctx.fillRect(tx + 4 * s, y - 8 * s, 2 * s, 14 * s);
      Text.draw(ctx, t.text, ui.w / 2, y + 3.5 * s, {
        font: Font.mono(10.5 * s, 600), color: kindCol, align: 'center', spacing: 0.6
      });
      ctx.restore();
      y -= 28 * s;
    }
  }

    });

    var msgs = [];
    if (p.hull / Math.max(1, st.maxHull) < 0.3) msgs.push(['HULL CRITICAL', '#ff5f6d']);
    if (p.energy < st.maxEnergy * 0.12) msgs.push(['ENERGY DEPLETED', '#ffcf5c']);
    if (SM.Profile.cargoFree(game.profile) < 1) msgs.push(['CARGO HOLD FULL', '#ffb257']);
    if (world.enemies.length > 3) msgs.push(['MULTIPLE HOSTILES', '#ff8f9b']);
    var y = ui.h * 0.5 - 40 * s;
    for (var i = 0; i < msgs.length; i++) {
      var a = 0.65 + 0.35 * Math.sin(world.time * 6 + i);

      ctx.globalAlpha = a;
      Text.draw(ctx, msgs[i][0], ui.w - 30 * s, 206 * s + i * 18 * s, {
        font: Font.mono(10 * s, 700), color: msgs[i][1], align: 'right', spacing: 2.2, shadow: hexA(msgs[i][1], 0.8), shadowBlur: 10
      });
      ctx.restore();
    }
  }

    var w = 380 * s, h = Math.min(ui.h - 200 * s, 420 * s);
    var x = 26 * s, y = ui.h - h - 224 * s;
    W.panel(ctx, x, y, w, h, { fill: 'rgba(6,14,22,0.94)', accent: '#5fe6d8' });
    var hdr = W.header(ctx, x + 16 * s, y + 14 * s, w - 32 * s, 'CARGO HOLD', { sub: 'TAB TO CLOSE' });
    var used = SM.Profile.cargoUsed(game.profile);
    var cap = SM.Profile.cargoCap(game.profile);
    W.bar(ctx, x + 16 * s, y + 44 * s, w - 32 * s, 8 * s, used / Math.max(1, cap), used / cap > 0.9 ? '#ff5f6d' : '#5fe6d8');
    Text.draw(ctx, used.toFixed(1) + ' / ' + cap + ' t', x + w - 16 * s, y + 42 * s, {
      font: Font.mono(9 * s), color: Theme.dim, align: 'right'
    });
    var listY = y + 62 * s;
    var rowH = 28 * s;
    var ids = Object.keys(game.profile.cargo).filter(function (id) { return game.profile.cargo[id] > 0; });
    ids.sort(function (a, b) { return (SM.Resources.get(b).value) - (SM.Resources.get(a).value); });
    if (!ids.length) {
      Text.draw(ctx, 'HOLD EMPTY — FIRE THE MINING BEAM AT AN ASTEROID', x + 16 * s, listY + 20 * s, {
        font: Font.mono(9 * s), color: Theme.dimmer
      });
      return;
    }
    var total = 0;
    for (var i = 0; i < ids.length && i < 12; i++) {
      var rid = ids[i];
      var res = SM.Resources.get(rid);
      var qty = game.profile.cargo[rid];
      var ry = listY + i * rowH;
      var icon = SM.Icons.resource(res);
      ctx.drawImage(icon.canvas, x + 16 * s, ry + 2 * s, 22 * s, 22 * s);
      Text.draw(ctx, res.name, x + 46 * s, ry + 12 * s, { font: Font.body(11.5 * s, 600), color: Theme.ink });
      Text.draw(ctx, 'x' + qty, x + 220 * s, ry + 12 * s, { font: Font.mono(10 * s, 600), color: res.color });

        font: Font.mono(10 * s, 600), color: '#ffd166', align: 'right'
      });
    }
    Text.draw(ctx, 'TOTAL VALUE ' + U.fmtNum(total) + ' CR', x + w - 16 * s, y + h - 14 * s, {
      font: Font.mono(10 * s, 700), color: '#ffe0a0', align: 'right', spacing: 1
    });
  }

  /* ---------------- sector name banner ---------------- */
  function drawSectorBanner(ctx, game, ui, world) {
    if (!world.bannerT) world.bannerT = 0;
    world.bannerT = Math.min(4.2, world.bannerT + game.dt);
    var t = world.bannerT;

  /* human readable current effect for an upgrade at a level */
  function effectLine(u, lvl) {
    var base = { laserPower: 1, penetration: 1, laserRange: 1, cargoCap: 0, massFactor: 1, maxSpeed: 1,
      turnRate: 1, accel: 1, drag: 1, maxHull: 0, maxShield: 0, shieldRegen: 0, energyRegen: 1,

    var before = {}, after = {};
    for (var k in base) { before[k] = base[k]; after[k] = base[k]; }
    if (lvl > 0) u.apply(before, lvl - 1);
    u.apply(after, lvl);
    var parts = [];
    for (var key in after) {
      var a = before[key], b = after[key];
      if (Math.abs(b - a) < 1e-6) continue;
      var label = key.replace(/([A-Z])/g, ' $1').toUpperCase();
      var fmt = function (v) {
        if (Math.abs(v) < 10 && v !== Math.round(v)) return v.toFixed(2);
        return Math.round(v * 10) / 10;
      };
      var arrow = b < a ? ' ▼' : ' ▲';
      parts.push(label + ' ' + fmt(a) + arrow + fmt(b));
    }
    if (!parts.length) return 'NO EFFECT APPLIED YET';
    return parts.slice(0, 2).join('   ');
  }

          ctx.translate(bx + 34 * s, by + cardH / 2);

          });

          Text.draw(ctx, unlocked ? 'UNLOCKED  +' + a.reward + ' CR' : 'REWARD ' + a.reward + ' CR',

  /* ==================== SECTOR CHART OVERLAY ==================== */
  function drawMap(game, ctx, ui) {
    var s = ui.s, w = ui.w, h = ui.h;
    var pr = game.profile;
    ctx.save();
    ctx.fillStyle = 'rgba(2,6,11,0.86)';
    ctx.fillRect(0, 0, w, h);

    var pw = Math.min(1060 * s, w - 50 * s), ph = Math.min(620 * s, h - 60 * s);
    var px = w / 2 - pw / 2, py = h / 2 - ph / 2;
    W.panel(ctx, px, py, pw, ph, { fill: 'rgba(6,13,22,0.98)', accent: '#5fe6d8' });
    W.header(ctx, px + 26 * s, py + 22 * s, pw - 52 * s, 'SECTOR CHART', {
      sub: 'M · CLOSE    ·    JUMP VIA CHART', accent: '#5fe6d8'
    });

    // chart area
    var cw = pw * 0.56, chh = ph - 100 * s;
    var cx = px + 26 * s, cy = py + 72 * s;
    ctx.save();
    Path.cutRect(ctx, cx, cy, cw, chh, 8 * s);
    ctx.fillStyle = 'rgba(2,6,12,0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,140,170,0.25)';
    ctx.stroke();
    ctx.clip();

    // grid + star dust
    ctx.strokeStyle = 'rgba(90,150,190,0.08)';
    ctx.lineWidth = 1;
    for (var gx = 0; gx < cw; gx += 40 * s) {
      ctx.beginPath(); ctx.moveTo(cx + gx, cy); ctx.lineTo(cx + gx, cy + chh); ctx.stroke();
    }
    for (var gy = 0; gy < chh; gy += 40 * s) {
      ctx.beginPath(); ctx.moveTo(cx, cy + gy); ctx.lineTo(cx + cw, cy + gy); ctx.stroke();
    }
    var rng = new U.RNG(4242);
    for (var st = 0; st < 160; st++) {
      ctx.fillStyle = 'rgba(200,230,255,' + rng.range(0.05, 0.4) + ')';
      ctx.fillRect(cx + rng.range(0, cw), cy + rng.range(0, chh), 1.4, 1.4);
    }

    function nodePos(sec) {
      return {
        x: cx + sec.mapPos.x * cw * 0.92 + cw * 0.04,
        y: cy + sec.mapPos.y * chh * 0.92 + chh * 0.04
      };
    }
    // jump lanes
    for (var l = 0; l < SM.Sectors.list.length - 1; l++) {
      var a1 = nodePos(SM.Sectors.list[l]);
      var a2 = nodePos(SM.Sectors.list[l + 1]);
      var open = pr.sectors.indexOf(SM.Sectors.list[l + 1].id) >= 0;
      ctx.strokeStyle = open ? 'rgba(95,230,216,0.45)' : 'rgba(120,150,170,0.18)';
      ctx.lineWidth = open ? 1.6 : 1;
      ctx.setLineDash(open ? [] : [5, 6]);
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y);
      ctx.lineTo(a2.x, a2.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    var sel = ui.mapSel || pr.sector;
    for (var i = 0; i < SM.Sectors.list.length; i++) {
      var sec = SM.Sectors.list[i];
      var p = nodePos(sec);
      var unlocked = pr.sectors.indexOf(sec.id) >= 0;
      var here = pr.sector === sec.id;
      var hover = U.dist(ui.mouse.x, ui.mouse.y, p.x, p.y) < 34 * s;

      if (hover && ui.click) { ui.consume(); ui.mapSel = sec.id; sel = sec.id; ui.play('uiHover'); }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var ng = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 54 * s);
      ng.addColorStop(0, hexA(sec.palette.accent, unlocked ? 0.28 : 0.08));
      ng.addColorStop(1, hexA(sec.palette.accent, 0));
      ctx.fillStyle = ng;
      ctx.beginPath(); ctx.arc(p.x, p.y, 54 * s, 0, 6.2832); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ui.t * 0.25 + i);
      ctx.strokeStyle = hexA(sec.palette.accent, unlocked ? 0.75 : 0.3);
      ctx.lineWidth = here ? 2.2 : 1.4;
      ctx.beginPath();
      for (var k = 0; k < 6; k++) {
        var ang = k / 6 * 6.2832;
        var rr = sel === sec.id ? 20 * s : 16 * s;
        if (k === 0) ctx.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        else ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath();
      ctx.stroke();
      if (unlocked) {
        ctx.fillStyle = hexA(sec.palette.accent, here ? 0.3 : 0.14);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(p.x, p.y);
      if (!unlocked) {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, -2 * s, 5 * s, Math.PI, 0);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-5 * s, -1 * s, 10 * s, 8 * s);
      }
      ctx.restore();

      Text.draw(ctx, sec.code, p.x, p.y + 34 * s, {
        font: Font.mono(8.5 * s, 600), color: hexA(sec.palette.accent, unlocked ? 0.95 : 0.5), align: 'center', spacing: 1.4
      });
      if (here) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.arc(p.x, p.y, 26 * s + Math.sin(ui.t * 3) * 2, 0, 6.2832); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();

    // info column
    var ix = cx + cw + 20 * s, iw = pw - cw - 72 * s;
    var sec2 = SM.Sectors.get(sel);
    var unlocked2 = pr.sectors.indexOf(sec2.id) >= 0;

    Text.draw(ctx, sec2.code, ix, py + 84 * s, {
      font: Font.mono(9.5 * s, 600), color: hexA(sec2.palette.accent, 0.95), spacing: 2
    });
    Text.draw(ctx, sec2.name, ix, py + 112 * s, {
      font: Font.title(21 * s, 700), color: Theme.ink, spacing: 2.6
    });
    Text.draw(ctx, sec2.subtitle, ix, py + 130 * s, {

    });
    var dl = Text.wrap(ctx, sec2.desc, iw, Font.body(11 * s));
    for (var d = 0; d < dl.length; d++) {
      Text.draw(ctx, dl[d], ix, py + 156 * s + d * 16 * s, { font: Font.body(11 * s), color: Theme.inkSoft });

    var ry = py + 156 * s + dl.length * 16 * s + 22 * s;
    Text.draw(ctx, 'DANGER', ix, ry, { font: Font.mono(8 * s, 600), color: Theme.dimmer, spacing: 2 });
    for (var dd = 0; dd < 5; dd++) {
      ctx.fillStyle = dd < sec2.danger ? hexA('#ff6b6b', 0.9) : 'rgba(255,255,255,0.1)';
      ctx.fillRect(ix + 62 * s + dd * 10 * s, ry - 8 * s, 7 * s, 10 * s);

    ry += 20 * s;

      })) {

        ui.play('warp');
      }
    } else {
      var ck = SM.Profile.canUnlock(pr, sec2.id);
      var reqLines2 = [];
      reqLines2.push(sec2.unlock.credits + ' CR   (' + U.fmtNum(pr.credits) + ' AVAILABLE)');
      for (var rid in sec2.unlock.deliver) {

      for (var rl = 0; rl < reqLines2.length; rl++) {

/* ---- ui/ui.js ---- */
/* =========================================================================
   SPACE MINER — UI orchestrator (state dispatch, input plumbing)
   ========================================================================= */
(function (root) {
  'use strict';
  var SM = root.SM || (root.SM = {});
  var U = SM.U, W = SM.W, Theme = SM.Theme, Font = SM.Font, Text = SM.Text, hexA = U.hexA;
  var Path = SM.Path;

  var UI = {
    w: 1280, h: 720, s: 1, t: 0,
    mouse: { x: 0, y: 0, down: false },
    click: null,
    wheel: 0,
    scroll: {},
    station: { tab: 'trade', cat: 'ALL' },
    mapSel: null,
    showCargo: false,
    confirm: null,
    lastHover: null,
    hoverId: null,
    game: null,

    init: function (game) { this.game = game; },

    reset: function () {
      this.scroll = {};
      this.station = { tab: 'trade', cat: 'ALL' };
      this.showCargo = false;
      this.confirm = null;
      this.mapSel = null;
    },

    openStation: function () { this.station.tab = 'trade'; this.showCargo = false; },
    toggleCargo: function () { this.showCargo = !this.showCargo; },

    consume: function () {
      if (this.game && this.game.input) this.game.input.clicks.shift();
      this.click = null;
    },

    play: function (name) { if (this.game) this.game.sfxUI(name); },

    sync: function (game) {
      var inp = game.input;
      this.w = game.renderer.w;
      this.h = game.renderer.h;
      this.s = U.clamp(Math.min(this.w / 1280, this.h / 720), 0.68, 1.35);
      if (inp) {
        this.mouse.x = inp.mouse.x;
        this.mouse.y = inp.mouse.y;
        this.mouse.down = inp.mouse.down;
        this.click = inp.peekClick();
        this.wheel = inp.consumeWheel();
      }
      this.t += game.dt || 0.016;
      this.hoverId = null;
    },

    finish: function (game) {
      if (!game.input) return;
      // clicks that no widget claimed are discarded (world handles held mouse)
      game.input.clicks.length = 0;
      if (game.canvas && game.canvas.style) {
        var interactive = this.hoverId && (game.state !== 'flight');
        game.canvas.style.cursor = interactive ? 'pointer' : (game.state === 'flight' ? 'crosshair' : 'default');
      }
      this.lastHover = this.hoverId || this.lastHover;
    },

    draw: function (game, ctx, dt) {
      this.sync(game);
      var state = game.state;
      var s = this.s;

      if (state === 'boot') { drawBoot(game, ctx, this); this.finish(game); return; }
      if (state === 'error') { drawError(game, ctx, this); this.finish(game); return; }

      // world/HUD beneath overlays
      if (game.world && ['flight', 'station', 'map', 'paused', 'dead', 'settings', 'achievements', 'controls'].indexOf(state) >= 0) {
        if (state !== 'settings' && state !== 'achievements' && state !== 'controls') {
          SM.HUD.draw(game, ctx, this);
        }
      }

      if (state === 'menu') SM.Menu.menu(game, ctx, this);
      else if (state === 'flight') { /* HUD only */ }
      else if (state === 'station') SM.StationUI.draw(game, ctx, this);
      else if (state === 'map') SM.Menu.map(game, ctx, this);
      else if (state === 'paused') SM.Menu.pause(game, ctx, this);
      else if (state === 'settings') SM.Menu.settings(game, ctx, this);
      else if (state === 'achievements') SM.Menu.achievements(game, ctx, this);
      else if (state === 'controls') SM.Menu.controls(game, ctx, this);
      else if (state === 'dead') SM.Menu.death(game, ctx, this);

      // confirm modal can appear over any screen
      if (this.confirm && state !== 'menu' && state !== 'settings') {
        SM.Menu.confirm(this, ctx, game);
      }

      this.finish(game);
    }
  };

  /* ---------------- boot screen ---------------- */
  function drawBoot(game, ctx, ui) {
    var s = ui.s, w = ui.w, h = ui.h;
    var g = ctx.createLinearGradient(0, 0, w * 0.4, h);
    g.addColorStop(0, '#050a12');
    g.addColorStop(0.5, '#08121e');
    g.addColorStop(1, '#03060a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var prog = U.clamp(game.bootT / 1.6, 0, 1);

    // rotating hex emblem
    ctx.save();
    ctx.translate(cx, cy - 60 * s);
    ctx.rotate(ui.t * 0.5);
    for (var r = 0; r < 3; r++) {
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = i / 6 * 6.2832;
        var rad = (60 + r * 18) * s;
        if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(95,230,216,' + (0.5 - r * 0.13) + ')';
      ctx.lineWidth = r === 0 ? 2 : 1;
      ctx.stroke();
    }
    ctx.restore();

    Text.draw(ctx, 'SPACE MINER', cx, cy + 10 * s, {
      font: Font.title(44 * s, 700), color: '#ffffff', align: 'center', spacing: 10 * s,
      shadow: 'rgba(95,230,216,0.6)', shadowBlur: 30
    });
    Text.draw(ctx, 'DEEP BELT OPERATIONS', cx, cy + 34 * s, {
      font: Font.mono(10 * s, 600), color: 'rgba(95,230,216,0.8)', align: 'center', spacing: 6 * s
    });

    // progress bar
    var bw = 420 * s, bx = cx - bw / 2, by = cy + 84 * s;
    W.bar(ctx, bx, by, bw, 5 * s, prog, '#5fe6d8', { cut: 2 });
    for (var l = 0; l < game.bootLines.length; l++) {
      var lineProgress = (l + 1) / game.bootLines.length;
      if (prog < lineProgress - 0.12) continue;
      Text.draw(ctx, game.bootLines[l], bx, by + 28 * s + l * 14 * s, {
        font: Font.mono(8.5 * s), color: 'rgba(140,180,205,0.7)', spacing: 1
      });
    }
    Text.draw(ctx, Math.round(prog * 100) + '%', bx + bw, by - 8 * s, {
      font: Font.mono(9 * s, 600), color: '#5fe6d8', align: 'right', spacing: 1
    });
  }

  function drawError(game, ctx, ui) {
    var s = ui.s, w = ui.w, h = ui.h;
    ctx.fillStyle = '#0a0406';
    ctx.fillRect(0, 0, w, h);
    Text.draw(ctx, 'FLIGHT SYSTEM FAULT', w / 2, h / 2 - 40 * s, {
      font: Font.title(24 * s, 700), color: '#ff8f9b', align: 'center', spacing: 4 * s
    });
    var msg = game.lastError ? (game.lastError.stack || game.lastError.message || String(game.lastError)) : 'unknown';
    var lines = String(msg).split('\n').slice(0, 8);
    for (var i = 0; i < lines.length; i++) {
      Text.draw(ctx, lines[i].slice(0, 120), w / 2, h / 2 + i * 16 * s, {
        font: Font.mono(10 * s), color: '#b98a92', align: 'center'
      });
    }
    Text.draw(ctx, 'PRESS F5 TO RESTART', w / 2, h - 60 * s, {
      font: Font.mono(10 * s, 600), color: '#ffd166', align: 'center', spacing: 2
    });
  }

  SM.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var fallback = document.getElementById('boot-fallback');
  var game = new SM.Game(canvas);
  SM.UI.init(game);
  window.SPACE_MINER = game;

  function resize() {
    game.renderer.resize(window.innerWidth, window.innerHeight,
      Math.min(window.devicePixelRatio || 1, 2));
    canvas.width = game.renderer.canvas.width;
    canvas.height = game.renderer.canvas.height;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    if (game.input) {
      game.input.screenW = window.innerWidth;
      game.input.screenH = window.innerHeight;
    }
  }

  window.addEventListener('resize', resize);
  resize();

  game.boot();
  game.startLoop();

  if (fallback) setTimeout(function () { fallback.style.display = 'none'; }, 400);

  // audio unlocks on the first real interaction (browser policy)
  var unlockAudio = function () {
    if (!game.audio.ready) game.audio.init();
    game.audio.resume();
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
  };
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown', unlockAudio);

  // autosave on tab close
  window.addEventListener('beforeunload', function () { try { game.save(); } catch (e) {} });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { try { game.save(); } catch (e) {} }
  });
  window.addEventListener('error', function (e) {
    if (window.console) console.error('[SPACE MINER] uncaught', e.error || e.message);
  });

  // Local host handshake: when the game is served by the native Windows
  // launcher on 127.0.0.1 the page keeps the session alive with a heartbeat.
  // Opening index.html directly is unaffected (no requests are made).
  try {
    var hosted = /^https?:$/.test(location.protocol) &&
                 /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
    if (hosted && typeof fetch === 'function') {
      var beat = function () {
        fetch('/__ping?t=' + Date.now(), { cache: 'no-store', keepalive: true })
          .catch(function () {});
      };
      beat();
      setInterval(beat, 5000);
    }
  } catch (e) { /* offline / file:// — nothing to do */ }
})();
</script>
