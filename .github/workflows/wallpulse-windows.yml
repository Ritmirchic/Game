name: Build & Verify WallPulse Windows x64

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "wallpulse/**"
      - ".github/workflows/wallpulse-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & Build WallPulse.exe v2.0.0 (MSVC x64 Release)
        shell: pwsh
        run: |
          $cfgOut = cmake -S wallpulse -B wallpulse/build -A x64 2>&1 | Out-String
          Write-Host $cfgOut
          if ($LASTEXITCODE -ne 0) {
            $enc = ($cfgOut -replace "%","%25" -replace "`r","%0D" -replace "`n","%0A")
            Write-Output "::error title=CMake Configure Failed::$enc"
            exit 1
          }

          $bldOut = cmake --build wallpulse/build --config Release 2>&1 | Out-String
          Write-Host $bldOut
          if ($LASTEXITCODE -ne 0) {
            $enc = ($bldOut -replace "%","%25" -replace "`r","%0D" -replace "`n","%0A")
            Write-Output "::error title=MSVC Build Failed::$enc"
            exit 1
          }

      - name: Verify PE32+ Headers & System-Only DLL Imports
        shell: pwsh
        run: |
          $exe = Resolve-Path "wallpulse/build/Release/WallPulse.exe"
          $info = Get-Item $exe
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($machine -ne 0x8664) { throw "Expected x86-64 PE32+ (0x8664)" }
          if ($subsystem -ne 2) { throw "Expected Windows GUI Subsystem (2)" }

          $depsSummary = "Size=$($info.Length) bytes, Machine=0x8664, Subsystem=GUI(2)"
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $dumpbin = & $vsWhere -latest -find "**\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
            if ($dumpbin) {
              $deps = & $dumpbin /dependents $exe | Out-String
              Write-Host $deps
              if ($deps -match "vcruntime|msvcp|libstdc|libgcc") {
                Write-Output "::error title=Non-static CRT DLL Found::$deps"
                throw "Found non-static runtime DLL dependency!"
              }
            }
          }
          Write-Output "::notice title=PE Verification Passed::$depsSummary"

      - name: Ensure Windows Media Foundation is enabled on Server runner
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\mfplat.dll")) {
            if (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue) {
              Write-Host "Installing Server-Media-Foundation..."
              Install-WindowsFeature -Name Server-Media-Foundation | Out-Null
            }
          } else {
            Write-Host "mfplat.dll already present."
          }

      - name: Run Real Windows v2.0 Integration Self-Test
        shell: pwsh
        run: |
          $testDataDir = Join-Path $env:RUNNER_TEMP "wallpulse_ci_data"
          New-Item -ItemType Directory -Force -Path $testDataDir | Out-Null
          $env:WALLPULSE_DATA_DIR = $testDataDir

          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe
            Start-Sleep -Seconds 3
          }

          $exe = Resolve-Path "wallpulse/build/Release/WallPulse.exe"
          $reportPath = Join-Path $env:RUNNER_TEMP "TEST_REPORT.txt"
          $shotPath = Join-Path $env:RUNNER_TEMP "STUDIO_UI.bmp"

          $proc = Start-Process -FilePath $exe -ArgumentList @("--self-test", $reportPath, $shotPath) -PassThru -Wait
          $exitCode = $proc.ExitCode

          $logTxt = ""
          if (Test-Path "$testDataDir\wallpulse.log") {
            $logTxt = Get-Content "$testDataDir\wallpulse.log" -Raw -Encoding UTF8
            Write-Host "=== wallpulse.log ==="
            Write-Host $logTxt
          }

          $repTxt = "No report generated"
          if (Test-Path $reportPath) {
            $repTxt = Get-Content $reportPath -Raw -Encoding UTF8
            Write-Host "=== TEST_REPORT.txt ==="
            Write-Host $repTxt
          }

          $combined = ($repTxt + "`n--- LOG ---`n" + $logTxt) -replace "%","%25" -replace "`r","%0D" -replace "`n","%0A"
          if ($exitCode -ne 0) {
            Write-Output "::error title=Windows Integration Self-Test Failed::$combined"
            exit 1
          }
          Write-Output "::notice title=Windows v2.0 Self-Test Report::$combined"

      - name: Package Source Archive & Publish GitHub Release v2.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP "wallpulse_dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item "wallpulse/build/Release/WallPulse.exe" "$distDir/WallPulse.exe" -Force
          Compress-Archive -Path "wallpulse/src", "wallpulse/resources", "wallpulse/CMakeLists.txt", "wallpulse/build_zig.sh", "wallpulse/README.md" -DestinationPath "$distDir/WallPulse_Source.zip" -Force

          $exeHash = (Get-FileHash "$distDir/WallPulse.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "$distDir/WallPulse_Source.zip" -Algorithm SHA256).Hash
          $exeSize = (Get-Item "$distDir/WallPulse.exe").Length
          $zipSize = (Get-Item "$distDir/WallPulse_Source.zip").Length
          $reportTxt = Get-Content (Join-Path $env:RUNNER_TEMP "TEST_REPORT.txt") -Raw -Encoding UTF8

          $notes = @"
          # WallPulse Studio v2.0.0 PRO — Живые MP4, GIF, GPU-Шейдеры, Аудиовизуализатор и Виджеты (Windows x64)

          Автономный однофайловый клон **Wallpaper Engine** на нативном C++17 (`Direct3D 11` + `Media Foundation DXVA2` + `WASAPI Loopback` + `Direct2D` + `WIC` + `OLE HTML5`).
          Не требует установки сторонних библиотек — скачайте **`WallPulse.exe`**, запустите двойным кликом и перетащите любой `.mp4`, `.gif`, `.hlsl` или `.html` файл (в комплекте уже есть **8 встроенных живых сцен**)!

          ## Что нового в v2.0.0 PRO
          1. **Аудиовизуализатор WASAPI Loopback** (`Столбцы`, `Неон-Волна`, `Неон-Кольцо`) + бас-реактивный пульс (`Bass Zoom & Glow`).
          2. **Плейлисты, плавный GPU Crossfade и расписание «День / Ночь»**.
          3. **Независимые обои на каждый монитор** одновременно.
          4. **Виджеты на слое обоев** позади значков (русские Часы и дата, «Сейчас играет», ЦП / ОЗУ).
          5. **PRO GPU-шейдеры** (`AMD CAS Sharpening`, `Hue Shift`, `Bloom`, `Хроматическая аберрация`, `VHS/ЭЛТ`).
          6. **Обрезка видео `От — До` и бесшовный цикл** без рывка при повторе.
          7. **Прозрачная / Акриловая панель задач Windows** + **Авто-акцент** Студии под цвет обоев.
          8. **Индивидуальные профили, Избранное ★, кириллический поиск и глобальные хоткеи** (`Ctrl+Alt+P/N/M/W`).
          9. **Поддержка `.mp4`, `.webm`, `.mkv`, `.gif`, 60-FPS GPU `shader://` / `.hlsl` и интерактивных `.html` обоев**.

          ## Прямые ссылки для скачивания
          - **Приложение (`WallPulse.exe`):** https://github.com/Ritmirchic/Game/releases/download/wallpulse-v2.0.0/WallPulse.exe ($exeSize байт, SHA-256: `$exeHash`)
          - **Исходный код (`WallPulse_Source.zip`):** https://github.com/Ritmirchic/Game/releases/download/wallpulse-v2.0.0/WallPulse_Source.zip ($zipSize байт, SHA-256: `$zipHash`)

          ## Результаты автоматической проверки на Windows
          ``````
          $reportTxt
          ``````
          "@

          $notesFile = Join-Path $env:RUNNER_TEMP "RELEASE_NOTES.md"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8

          $tag = "wallpulse-v2.0.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$distDir/WallPulse.exe" "$distDir/WallPulse_Source.zip" --clobber
            gh release edit $tag --title "WallPulse Studio v2.0.0 PRO — Живые обои, Шейдеры & Визуализатор (Windows x64)" --notes-file $notesFile
          } else {
            gh release create $tag "$distDir/WallPulse.exe" "$distDir/WallPulse_Source.zip" `
              --target "${{ github.sha }}" `
              --title "WallPulse Studio v2.0.0 PRO — Живые обои, Шейдеры & Визуализатор (Windows x64)" `
              --notes-file $notesFile
          }
          Write-Output "::notice title=Release Published::https://github.com/Ritmirchic/Game/releases/download/wallpulse-v2.0.0/WallPulse.exe (SHA256=$exeHash)"
