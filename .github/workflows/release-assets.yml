name: attach-release-assets

# The build sandbox cannot reach uploads.github.com, so the binaries that are committed
# under release/ are attached to the release tag from a GitHub runner instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to
        required: true
        default: fracture-v1.0.1

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify binaries
        run: |
          ls -l release/
          test -s release/FRACTURE_TOTAL_DESTRUCTION.exe
          test -s release/FRACTURE_SOURCE.zip
          python3 - <<'PY'
          import struct
          d = open('release/FRACTURE_TOTAL_DESTRUCTION.exe','rb').read()
          pe = struct.unpack_from('<I', d, 0x3c)[0]
          machine, nsec = struct.unpack_from('<HH', d, pe + 4)
          magic = struct.unpack_from('<H', d, pe + 24)[0]
          sub = struct.unpack_from('<H', d, pe + 24 + 68)[0]
          print(f'PE machine=0x{machine:x} magic=0x{magic:x} subsystem={sub} size={len(d)}')
          assert machine == 0x8664 and magic == 0x20b and sub == 2
          PY
      - name: Attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            release/FRACTURE_TOTAL_DESTRUCTION.exe \
            release/FRACTURE_SOURCE.zip --clobber
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size) bytes"'
