name: FRACTURE prototype Windows build
on:
  push:
    branches: ['arena/fedc78e9-game']
    paths: ['fracture/**', '.github/workflows/fracture-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and export templates
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot/releases/download/4.4.1-stable'
          Invoke-WebRequest "$base/Godot_v4.4.1-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "$base/Godot_v4.4.1-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dir = "$env:APPDATA/Godot/export_templates/4.4.1.stable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item 'templates/templates/*' $dir -Recurse
      - name: Import and test voxel geometry and collision
        timeout-minutes: 3
        shell: pwsh
        run: |
          $godot = (Resolve-Path 'godot/Godot_v4.4.1-stable_win64_console.exe').Path
          $importLog = Join-Path $env:RUNNER_TEMP 'godot-import.log'
          & $godot --headless --log-file $importLog --path fracture --editor --quit
          $importCode = $LASTEXITCODE
          $testLog = Join-Path $env:RUNNER_TEMP 'godot-test.log'
          & $godot --headless --log-file $testLog --path fracture --script res://tests/test_voxels.gd
          $testCode = $LASTEXITCODE
          foreach ($log in @($importLog, $testLog)) {
            if (Test-Path $log) {
              Get-Content $log | Where-Object { $_ -match 'ERROR|Parse Error|FAIL|   at:' } | ForEach-Object { Write-Output "::error::$_" }
            }
          }
          if ($importCode -ne 0 -or $testCode -ne 0) { exit 1 }
          if ((Get-Content $importLog -Raw) -match 'SCRIPT ERROR|Parse Error') { exit 1 }
      - name: Export Windows prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          $godot = (Resolve-Path 'godot/Godot_v4.4.1-stable_win64_console.exe').Path
          $output = (Join-Path $PWD 'package/FRACTURE_TOTAL_DESTRUCTION.exe')
          & $godot --headless --path fracture --export-release 'Windows Desktop' $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item fracture/README.md package/README.md
          Copy-Item fracture/ATTRIBUTION.md package/ATTRIBUTION.md
      - name: Smoke test exported executable
        timeout-minutes: 3
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'fracture-smoke.log'
          $exe = Join-Path $PWD 'package/FRACTURE_TOTAL_DESTRUCTION.exe'
          $process = Start-Process $exe -ArgumentList @('--headless', '--quit-after', '30', '--log-file', $log) -Wait -PassThru
          if (Test-Path $log) {
            $text = Get-Content $log -Raw
            Get-Content $log | Where-Object { $_ -match 'ERROR|Parse Error|   at:' } | ForEach-Object { Write-Output "::error::$_" }
            if ($text -match 'SCRIPT ERROR|Parse Error|ERROR:') { exit 1 }
          } else { Write-Output '::error::The exported game did not produce a log'; exit 1 }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_WINDOWS_PROTOTYPE
          path: package/
          if-no-files-found: error
