name: Deploy ANVILIGHT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, progression and interface tests
        run: npm test
      - name: Production build
        run: npm run build
      # If the repository has not enabled Pages (or the workflow token may not create
      # the site), keep the test/build job green and let the deploy job skip cleanly.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
