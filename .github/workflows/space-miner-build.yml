# Release verification includes consumed-ore regression coverage.
name: Build Space Miner Windows x64
on:
  push:
    branches: [arena/e2d195b1-game]
    paths: [.github/workflows/space-miner-build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e2d195b1-game
      - name: Install official Godot and export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          unzip -j /tmp/templates.tpz templates/windows_release_x86_64.exe -d ~/.local/share/godot/export_templates/4.7.1.stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
      - name: Import and build release
        run: |
          set -euo pipefail
          mkdir -p releases delivery
          /tmp/godot/Godot* --headless --path space_miner --editor --import
          XDG_DATA_HOME=/tmp/space-miner-tests /tmp/godot/Godot* --headless --path space_miner --script res://tests/suite.gd | tee /tmp/space-miner-tests.log
          grep -q 'RESULT: 44 checks, 0 failures' /tmp/space-miner-tests.log
          /tmp/godot/Godot* --headless --path space_miner --export-release Windows
          cp space_miner/PLAYER_GUIDE.md releases/PLAYER_GUIDE.md
          cp -r space_miner/licenses releases/licenses
          makensis space_miner/tools/installer.nsi
          (cd releases && zip -r -9 ../delivery/SPACE_MINER_WINDOWS.zip SPACE_MINER.exe PLAYER_GUIDE.md licenses)
          cp releases/SPACE_MINER_SETUP.exe delivery/
          sha256sum delivery/SPACE_MINER_WINDOWS.zip delivery/SPACE_MINER_SETUP.exe > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SPACE_MINER_WINDOWS
          path: delivery/
      - name: Return release packages to the session branch
        run: |
          set -euo pipefail
          git config user.name "Arena Build Agent"
          git config user.email "arena-build@users.noreply.github.com"
          git add delivery/
          git commit -m "build: Windows x64 portable release and NSIS installer"
          git push origin arena/e2d195b1-game
  windows-smoke:
    needs: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SPACE_MINER_WINDOWS
          path: delivery
      - name: Run portable Windows executable
        shell: pwsh
        run: |
          Expand-Archive delivery/SPACE_MINER_WINDOWS.zip portable
          $exe = (Resolve-Path portable/SPACE_MINER.exe).Path
          $log = Join-Path $env:RUNNER_TEMP 'portable-smoke.log'
          $p = Start-Process $exe -ArgumentList @('--headless','--log-file',$log,'--','--smoke') -PassThru -Wait
          Get-Content $log
          if ($p.ExitCode -ne 0 -or !(Select-String -Path $log -Pattern 'RUNTIME_SMOKE_OK' -Quiet)) { throw 'Windows portable smoke failed' }
      - name: Test per-user installation, launch and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path delivery/SPACE_MINER_SETUP.exe).Path
          $p = Start-Process $installer -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SpaceMiner\SPACE_MINER.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $log = Join-Path $env:RUNNER_TEMP 'installed-smoke.log'
          $p = Start-Process $exe -ArgumentList @('--headless','--log-file',$log,'--','--smoke') -PassThru -Wait
          Get-Content $log
          if ($p.ExitCode -ne 0 -or !(Select-String -Path $log -Pattern 'RUNTIME_SMOKE_OK' -Quiet)) { throw 'Installed Windows smoke failed' }
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\SpaceMiner\Uninstall.exe'
          Start-Process $uninstaller -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'Uninstall did not remove executable' }
