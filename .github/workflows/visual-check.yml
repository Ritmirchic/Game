name: Godot runtime and visual verification

on:
  push:
    branches:
      - arena/e35240c2-game
    paths:
      - project.godot
      - scenes/**
      - scripts/**
      - assets/**
      - tests/**
      - .github/workflows/visual-check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e35240c2-game
      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Download and verify official Godot 4.4.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 4 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -fL --retry 4 -o "$RUNNER_TEMP/SHA512-SUMS.txt" https://github.com/godotengine/godot/releases/download/4.4.1-stable/SHA512-SUMS.txt
          (cd "$RUNNER_TEMP" && grep 'Godot_v4.4.1-stable_linux.x86_64.zip$' SHA512-SUMS.txt | sha512sum -c -)
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: "$GODOT" --headless --path "$GITHUB_WORKSPACE" --editor --quit
      - name: Run gameplay and UI suite
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
        run: |
          set -o pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          ! grep -q 'SCRIPT ERROR\|ERROR:' "$RUNNER_TEMP/tests.log"
      - name: Render actual game screens
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path "$GITHUB_WORKSPACE" --audio-driver Dummy --resolution 1600x900 --script res://tests/capture.gd 2>&1 | tee "$RUNNER_TEMP/capture.log"
          ! grep -q 'SCRIPT ERROR\|ERROR:' "$RUNNER_TEMP/capture.log"
          test "$(find shots -name '*.png' | wc -l)" -ge 16
      - name: Publish reviewed captures to working branch
        run: |
          set -euo pipefail
          git config user.name "Arena Visual Tests"
          git config user.email "arena-visual@users.noreply.github.com"
          git add shots/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'test: refresh rendered game captures [skip ci]'
            git push origin arena/e35240c2-game
          fi
