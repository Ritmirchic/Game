name: Bootstrap official Godot runtime

on:
  push:
    branches:
      - arena/e35240c2-game
    paths:
      - .github/workflows/bootstrap-godot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e35240c2-game
      - name: Download official Godot 4.4.1
        run: |
          set -euo pipefail
          mkdir -p .engine
          curl -fL --retry 4 -o .engine/Godot_v4.4.1-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -fL --retry 4 -o /tmp/SHA512-SUMS.txt \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/SHA512-SUMS.txt
          (cd .engine && grep 'Godot_v4.4.1-stable_linux.x86_64.zip$' /tmp/SHA512-SUMS.txt | sha512sum -c -)
      - name: Cache runtime on working branch temporarily
        run: |
          set -euo pipefail
          git config user.name "Arena Build Agent"
          git config user.email "arena-build@users.noreply.github.com"
          git add .engine/Godot_v4.4.1-stable_linux.x86_64.zip
          git commit -m "chore: temporarily cache official Godot runtime"
          git push origin arena/e35240c2-game
